name: GuardianBot reusable image security

on:
  workflow_call:
    inputs:
      dockerfile: { required: true, type: string }
      context: { required: true, type: string }
      image-name: { required: true, type: string }
      health-path: { required: true, type: string }
      readiness-path: { required: false, type: string, default: "" }
      container-port: { required: false, type: number, default: 8000 }
      smoke-command: { required: false, type: string, default: "" }
      push: { required: false, type: boolean, default: false }

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  image:
    name: image build, smoke, scan, SBOM, sign
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build exact linux/amd64 image
        run: |
          mkdir -p guardianbot-image-evidence
          docker build --platform linux/amd64 \
            --file "${{ inputs.dockerfile }}" \
            --tag "${{ inputs.image-name }}:${GITHUB_SHA}" "${{ inputs.context }}"
          docker image inspect "${{ inputs.image-name }}:${GITHUB_SHA}" \
            --format '{{json .RepoDigests}}' > guardianbot-image-evidence/build-digests.json
      - name: Repository-specific application tests
        if: inputs.smoke-command != ''
        run: ${{ inputs.smoke-command }}
      - name: Boot and verify exact image
        run: |
          docker run -d --rm --name guardianbot-smoke \
            -p 127.0.0.1:${{ inputs.container-port }}:${{ inputs.container-port }} \
            "${{ inputs.image-name }}:${GITHUB_SHA}"
          trap 'docker logs guardianbot-smoke; docker stop guardianbot-smoke' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent "http://127.0.0.1:${{ inputs.container-port }}${{ inputs.health-path }}" && break
            sleep 2
          done
          curl --fail "http://127.0.0.1:${{ inputs.container-port }}${{ inputs.health-path }}"
          if [ -n "${{ inputs.readiness-path }}" ]; then
            curl --fail "http://127.0.0.1:${{ inputs.container-port }}${{ inputs.readiness-path }}"
          fi
      - name: Trivy image scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/guardianbot-image-evidence:/evidence" aquasec/trivy:0.64.1 \
            image --format json --output /evidence/trivy-image.json \
            --severity CRITICAL --exit-code 1 "${{ inputs.image-name }}:${GITHUB_SHA}"
      - name: CycloneDX SBOM from exact image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/guardianbot-image-evidence:/evidence" aquasec/trivy:0.64.1 \
            image --format cyclonedx --output /evidence/sbom.cdx.json \
            "${{ inputs.image-name }}:${GITHUB_SHA}"
          test -s guardianbot-image-evidence/sbom.cdx.json
      - name: Authenticate GHCR
        if: inputs.push
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push immutable content
        if: inputs.push
        run: docker push "${{ inputs.image-name }}:${GITHUB_SHA}"
      - name: Install Cosign
        if: inputs.push
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
      - name: Keyless sign and attest
        if: inputs.push
        run: |
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${{ inputs.image-name }}:${GITHUB_SHA}")"
          test -n "$digest"
          cosign sign --yes "$digest"
          cosign attest --yes --type cyclonedx \
            --predicate guardianbot-image-evidence/sbom.cdx.json "$digest"
          cosign verify "$digest" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            > guardianbot-image-evidence/cosign-verification.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guardianbot-image-evidence-${{ github.run_id }}
          path: guardianbot-image-evidence/
          if-no-files-found: error
