name: GuardianBot reusable security

on:
  workflow_call:
    inputs:
      config-path:
        description: Versioned repository configuration
        required: true
        type: string
      baseline-path:
        description: Baseline fingerprint document required before enforce mode
        required: false
        default: .guardianbot/baseline.json
        type: string

permissions:
  contents: read

jobs:
  scanners:
    name: deterministic scanners
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out reviewed repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate GuardianBot configuration
        id: config
        env:
          INPUT_CONFIG_PATH: ${{ inputs.config-path }}
          INPUT_BASELINE_PATH: ${{ inputs.baseline-path }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if [ -e guardianbot-evidence ] || [ -L guardianbot-evidence ]; then
            echo "guardianbot-evidence is a reserved workflow path."
            exit 1
          fi
          install -d -m 700 guardianbot-evidence
          config_path="$INPUT_CONFIG_PATH"
          baseline_path="$INPUT_BASELINE_PATH"
          for candidate in "$config_path" "$baseline_path"; do
            case "$candidate" in
              ""|/*|*..*)
                echo "GuardianBot paths must be non-empty repository-relative paths without '..'."
                exit 1
                ;;
            esac
            [[ "$candidate" =~ ^[A-Za-z0-9._/-]+$ ]] || {
              echo "GuardianBot paths contain unsupported characters."
              exit 1
            }
          done
          test -f "$config_path"

          # A pull request must not be able to weaken its own gate by changing
          # scanner mode, suppressions, or baseline fingerprints. Once a
          # repository is onboarded, those controls come from the immutable
          # base commit. The first onboarding PR may use its head config, but
          # only in non-enforcing mode.
          effective_config="$config_path"
          effective_baseline="$baseline_path"
          config_source="head"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base_sha="$PULL_REQUEST_BASE_SHA"
            if git cat-file -e "${base_sha}:${config_path}" 2>/dev/null; then
              git show "${base_sha}:${config_path}" > guardianbot-evidence/effective-config.yml
              effective_config="guardianbot-evidence/effective-config.yml"
              config_source="base"
            fi
            if git cat-file -e "${base_sha}:${baseline_path}" 2>/dev/null; then
              git show "${base_sha}:${baseline_path}" > guardianbot-evidence/effective-baseline.json
              effective_baseline="guardianbot-evidence/effective-baseline.json"
            else
              effective_baseline="guardianbot-evidence/missing-baseline.json"
            fi
          fi

          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work:ro" mikefarah/yq:4.44.6@sha256:b1d117c609ba990436ad1649299e2f6c378f62cb562caf30b6f2fb6144713422 \
            '.schemaVersion == "1.0.0" and (.workflowVersion | test("^[a-f0-9]{40}$"))' \
            "/work/${effective_config}" | grep -qx true
          mode="$(docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work:ro" mikefarah/yq:4.44.6@sha256:b1d117c609ba990436ad1649299e2f6c378f62cb562caf30b6f2fb6144713422 \
            '.scanners.mode' "/work/${effective_config}")"
          case "$mode" in advisory|report-only|enforce) ;; *) exit 1 ;; esac
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] &&
             [ "$config_source" = "head" ] &&
             [ "$mode" = "enforce" ]; then
            echo "The first onboarding pull request cannot enable enforcement."
            exit 1
          fi
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work:ro" mikefarah/yq:4.44.6@sha256:b1d117c609ba990436ad1649299e2f6c378f62cb562caf30b6f2fb6144713422 \
            '
              (.scanners.suppressions // []) |
              all(
                (.fingerprint | type == "!!str") and
                (.owner | type == "!!str") and
                (.reason | type == "!!str") and
                (.ticket | type == "!!str") and
                ((.expiresAt | type) == "!!timestamp" or (.expiresAt | type) == "!!str")
              )
            ' "/work/${effective_config}" | grep -qx true
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work:ro" mikefarah/yq:4.44.6@sha256:b1d117c609ba990436ad1649299e2f6c378f62cb562caf30b6f2fb6144713422 \
            -o=json '.scanners.suppressions // []' \
            "/work/${effective_config}" > guardianbot-evidence/suppressions.json
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "baseline-path=$effective_baseline" >> "$GITHUB_OUTPUT"
          echo "config-source=$config_source" >> "$GITHUB_OUTPUT"
          workflow_version="$(docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work:ro" mikefarah/yq:4.44.6@sha256:b1d117c609ba990436ad1649299e2f6c378f62cb562caf30b6f2fb6144713422 \
            '.workflowVersion' "/work/${effective_config}")"
          echo "workflow-version=$workflow_version" >> "$GITHUB_OUTPUT"

      - name: Check out immutable GuardianBot rule pack
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: guardianbot-engine
          persist-credentials: false

      - name: Verify immutable GuardianBot rule pack
        id: rule_pack
        env:
          CALLED_WORKFLOW_REF: ${{ job.workflow_ref }}
          CALLED_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          CALLED_WORKFLOW_SHA: ${{ job.workflow_sha }}
          CONFIGURED_WORKFLOW_SHA: ${{ steps.config.outputs.workflow-version }}
        shell: bash
        run: |
          workflow_revision="${CALLED_WORKFLOW_REF##*@}"
          [[ "$CALLED_WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo "Called workflow repository is invalid."
            exit 1
          }
          [[ "$workflow_revision" =~ ^[a-f0-9]{40}$ ]] || {
            echo "GuardianBot callers must pin the reusable workflow to a full commit SHA."
            exit 1
          }
          test "$workflow_revision" = "$CALLED_WORKFLOW_SHA"
          test "$CONFIGURED_WORKFLOW_SHA" = "$CALLED_WORKFLOW_SHA"
          resolved_revision="$(git -C guardianbot-engine rev-parse HEAD)"
          test "$resolved_revision" = "$CALLED_WORKFLOW_SHA"
          test -s guardianbot-engine/rules/semgrep.yml
          printf '%s\n' "$resolved_revision" \
            > guardianbot-evidence/rule-pack-revision.txt

      - name: Semgrep
        shell: bash
        run: |
          docker run --rm -v "$PWD:/src" \
            semgrep/semgrep:1.130.0@sha256:7674a72a8bd5beaa4591b728e5950c04c58b27b82803901f36e7f9d70b828906 \
            semgrep scan \
              --config /src/guardianbot-engine/rules/semgrep.yml \
              --exclude .git \
              --exclude guardianbot-engine \
              --exclude guardianbot-evidence \
              --json \
              --output /src/guardianbot-evidence/semgrep.json \
              /src \
            || printf '%s\n' '{"scanner_error":true}' \
              > guardianbot-evidence/semgrep.json

      - name: Trivy filesystem, dependencies, configuration, licenses, and secrets
        shell: bash
        run: |
          trivy_raw="guardianbot-evidence/trivy-raw.json"
          if docker run --rm -v "$PWD:/workspace" aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
            fs --format json --scanners vuln,misconfig,secret,license \
            --skip-dirs /workspace/guardianbot-engine \
            --skip-dirs /workspace/guardianbot-evidence \
            --output "/workspace/${trivy_raw}" /workspace; then
            if ! node - "$trivy_raw" "guardianbot-evidence/trivy.json" <<'NODE'
          const fs = require("node:fs");

          const [, , inputPath, outputPath] = process.argv;
          const MAX_SUMMARY_LENGTH = 500;

          const asRecord = (value) =>
            value && typeof value === "object" && !Array.isArray(value) ? value : undefined;

          const boundedText = (value, fallback) => {
            const normalized = String(value ?? fallback).replace(/\s+/g, " ").trim();
            return (normalized || fallback).slice(0, MAX_SUMMARY_LENGTH);
          };

          const normalizedLine = (value) => {
            const line = Number(value);
            return Number.isInteger(line) && line > 0 ? line : undefined;
          };

          const compact = (value) =>
            Object.fromEntries(
              Object.entries(value).filter(([, entry]) => entry !== undefined)
            );

          const sanitizeVulnerabilities = (value) =>
            Array.isArray(value)
              ? value
                  .map((entry) => asRecord(entry))
                  .filter(Boolean)
                  .map((entry) => {
                    const ruleId = String(entry.VulnerabilityID ?? "unknown");
                    return compact({
                      VulnerabilityID: ruleId,
                      Severity: String(entry.Severity ?? "UNKNOWN"),
                      Title: boundedText(entry.Title, ruleId),
                      Description: boundedText(entry.Description, boundedText(entry.Title, ruleId)),
                      PkgName: String(entry.PkgName ?? ""),
                      InstalledVersion: String(entry.InstalledVersion ?? ""),
                      FixedVersion: String(entry.FixedVersion ?? "")
                    });
                  })
              : [];

          const sanitizeMisconfigurations = (value) =>
            Array.isArray(value)
              ? value
                  .map((entry) => asRecord(entry))
                  .filter(Boolean)
                  .map((entry) => {
                    const causeMetadata = asRecord(entry.CauseMetadata);
                    const ruleId = String(entry.AVDID ?? entry.ID ?? entry.Type ?? "unknown");
                    const title = boundedText(entry.Title ?? entry.Message, ruleId);
                    return compact({
                      ID: String(entry.ID ?? ""),
                      AVDID: String(entry.AVDID ?? ""),
                      Type: String(entry.Type ?? ""),
                      Severity: String(entry.Severity ?? "UNKNOWN"),
                      Title: title,
                      Description: boundedText(
                        entry.Description ?? entry.Message ?? entry.Resolution,
                        title
                      ),
                      Message: boundedText(entry.Message, title),
                      Resolution: boundedText(entry.Resolution, title),
                      PrimaryURL: typeof entry.PrimaryURL === "string" ? entry.PrimaryURL : undefined,
                      CauseMetadata: causeMetadata
                        ? compact({
                            Resource:
                              typeof causeMetadata.Resource === "string"
                                ? causeMetadata.Resource
                                : undefined,
                            Provider:
                              typeof causeMetadata.Provider === "string"
                                ? causeMetadata.Provider
                                : undefined,
                            Service:
                              typeof causeMetadata.Service === "string"
                                ? causeMetadata.Service
                                : undefined,
                            StartLine: normalizedLine(causeMetadata.StartLine),
                            EndLine: normalizedLine(causeMetadata.EndLine)
                          })
                        : undefined
                    });
                  })
              : [];

          const sanitizeSecrets = (value) =>
            Array.isArray(value)
              ? value
                  .map((entry) => asRecord(entry))
                  .filter(Boolean)
                  .map((entry) =>
                    compact({
                      RuleID: String(entry.RuleID ?? entry.Category ?? "secret"),
                      Category: String(entry.Category ?? ""),
                      Severity: String(entry.Severity ?? "UNKNOWN"),
                      Title: boundedText(
                        entry.Title,
                        String(entry.Category ?? "Potential secret detected")
                      ),
                      StartLine: normalizedLine(entry.StartLine),
                      EndLine: normalizedLine(entry.EndLine)
                    })
                  )
              : [];

          const sanitizeLicenses = (value) =>
            Array.isArray(value)
              ? value
                  .map((entry) => asRecord(entry))
                  .filter(Boolean)
                  .map((entry) =>
                    compact({
                      Name: String(entry.Name ?? entry.Category ?? "unknown-license"),
                      Severity: String(entry.Severity ?? "UNKNOWN"),
                      Category: String(entry.Category ?? ""),
                      PkgName: String(entry.PkgName ?? ""),
                      InstalledVersion: String(entry.InstalledVersion ?? "")
                    })
                  )
              : [];

          const raw = JSON.parse(fs.readFileSync(inputPath, "utf8"));
          const report = asRecord(raw);
          if (
            !report ||
            report.SchemaVersion !== 2 ||
            typeof report.ArtifactName !== "string" ||
            !report.ArtifactName ||
            typeof report.ArtifactType !== "string" ||
            !report.ArtifactType ||
            !Array.isArray(report.Results)
          ) {
            throw new Error("Trivy report is incomplete");
          }

          const sanitized = {
            SchemaVersion: 2,
            ArtifactName: report.ArtifactName,
            ArtifactType: report.ArtifactType,
            Results: report.Results
              .map((entry) => asRecord(entry))
              .filter(Boolean)
              .map((entry) =>
                compact({
                  Target: String(entry.Target ?? ""),
                  Class: typeof entry.Class === "string" ? entry.Class : undefined,
                  Type: typeof entry.Type === "string" ? entry.Type : undefined,
                  Vulnerabilities: sanitizeVulnerabilities(entry.Vulnerabilities),
                  Misconfigurations: sanitizeMisconfigurations(entry.Misconfigurations),
                  Secrets: sanitizeSecrets(entry.Secrets),
                  Licenses: sanitizeLicenses(entry.Licenses)
                })
              )
          };

          fs.writeFileSync(outputPath, JSON.stringify(sanitized, null, 2));
          NODE
            then
              printf '%s\n' '{"scanner_error":true}' > guardianbot-evidence/trivy.json
            fi
          else
            printf '%s\n' '{"scanner_error":true}' > guardianbot-evidence/trivy.json
          fi
          shred -u "$trivy_raw" 2>/dev/null || rm -f "$trivy_raw"

      - name: Evaluate new-finding policy
        id: gate
        env:
          SCANNER_MODE: ${{ steps.config.outputs.mode }}
          BASELINE_PATH: ${{ steps.config.outputs.baseline-path }}
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");
          const MAX_SUMMARY_LENGTH = 500;

          const stableFingerprint = (parts) =>
            crypto
              .createHash("sha256")
              .update(
                parts
                  .map((part) => String(part ?? "").trim().toLowerCase())
                  .join("\u001f")
              )
              .digest("hex");
          const legacyScannerFingerprint = (parts) =>
            crypto
              .createHash("sha256")
              .update(parts.join("\u241f"))
              .digest("hex");
          const fingerprintFields = (parts) => ({
            fingerprint: stableFingerprint(parts),
            legacyFingerprint: legacyScannerFingerprint(parts)
          });

          const asRecord = (value) =>
            value && typeof value === "object" && !Array.isArray(value) ? value : undefined;

          const boundedText = (value, fallback) => {
            const normalized = String(value ?? fallback).replace(/\s+/g, " ").trim();
            return (normalized || fallback).slice(0, MAX_SUMMARY_LENGTH);
          };

          const normalizedLine = (value) => {
            const line = Number(value);
            return Number.isInteger(line) && line > 0 ? line : undefined;
          };

          const semgrepSeverity = {
            ERROR: "high",
            WARNING: "medium",
            INFO: "info",
            CRITICAL: "critical",
            HIGH: "high",
            MEDIUM: "medium",
            LOW: "low"
          };

          const trivySeverity = {
            CRITICAL: "critical",
            HIGH: "high",
            MEDIUM: "medium",
            LOW: "low",
            UNKNOWN: "info"
          };

          const validateSemgrepReport = (report) => {
            const root = asRecord(report);
            if (!root || !Array.isArray(root.results)) {
              throw new Error("Semgrep evidence is missing the results array");
            }
          };

          const validateTrivyReport = (report) => {
            const root = asRecord(report);
            if (
              !root ||
              root.SchemaVersion !== 2 ||
              typeof root.ArtifactName !== "string" ||
              !root.ArtifactName ||
              typeof root.ArtifactType !== "string" ||
              !root.ArtifactType ||
              !Array.isArray(root.Results)
            ) {
              throw new Error("Trivy evidence is incomplete");
            }
          };

          const normalizeSemgrep = (report) =>
            (report.results || []).map((entry) => {
              const extra = entry.extra || {};
              const start = entry.start || {};
              const ruleId = String(entry.check_id || "unknown");
              const findingPath = String(entry.path || "");
              const line = Number(start.line || 1);
              const title = String(extra.message || ruleId);
              return {
                source: "semgrep",
                ...fingerprintFields(["semgrep", ruleId, findingPath, line, title]),
                severity: semgrepSeverity[String(extra.severity || "WARNING").toUpperCase()] || "medium",
                ruleId,
                path: findingPath,
                line,
                title
              };
            });

          const normalizeTrivy = (report) => {
            const findings = [];
            for (const result of report.Results || []) {
              const target = String(result.Target || "");
              for (const vulnerability of result.Vulnerabilities || []) {
                const ruleId = String(vulnerability.VulnerabilityID || "unknown");
                const packageName = String(vulnerability.PkgName || "");
                const installedVersion = String(vulnerability.InstalledVersion || "");
                findings.push({
                  source: "trivy",
                  scannerClass: "vulnerability",
                  ...fingerprintFields([
                    "trivy",
                    ruleId,
                    packageName,
                    installedVersion,
                    target
                  ]),
                  severity: trivySeverity[String(vulnerability.Severity || "UNKNOWN").toUpperCase()] || "info",
                  ruleId,
                  path: target,
                  packageName,
                  installedVersion,
                  title: boundedText(vulnerability.Title, ruleId),
                  description: boundedText(vulnerability.Description, boundedText(vulnerability.Title, ruleId)),
                  fixedVersion: String(vulnerability.FixedVersion || "")
                });
              }
              for (const misconfiguration of result.Misconfigurations || []) {
                const causeMetadata = asRecord(misconfiguration.CauseMetadata);
                const ruleId = String(
                  misconfiguration.AVDID || misconfiguration.ID || misconfiguration.Type || "unknown"
                );
                const line = normalizedLine(causeMetadata?.StartLine);
                const title = boundedText(
                  misconfiguration.Title || misconfiguration.Message,
                  ruleId
                );
                findings.push({
                  source: "trivy",
                  scannerClass: "misconfiguration",
                  ...fingerprintFields([
                    "trivy",
                    "misconfiguration",
                    ruleId,
                    target,
                    String(causeMetadata?.Resource || ""),
                    line || "",
                    normalizedLine(causeMetadata?.EndLine) || ""
                  ]),
                  severity:
                    trivySeverity[String(misconfiguration.Severity || "UNKNOWN").toUpperCase()] || "info",
                  ruleId,
                  path: target,
                  line,
                  title,
                  description: boundedText(
                    misconfiguration.Description ||
                      misconfiguration.Message ||
                      misconfiguration.Resolution,
                    title
                  )
                });
              }
              for (const secret of result.Secrets || []) {
                const ruleId = String(secret.RuleID || secret.Category || "secret");
                const line = normalizedLine(secret.StartLine);
                const endLine = normalizedLine(secret.EndLine);
                const category = String(secret.Category || "").trim();
                const title = category
                  ? `Potential ${category} secret`
                  : `Potential secret: ${ruleId}`;
                findings.push({
                  source: "trivy",
                  scannerClass: "secret",
                  ...fingerprintFields([
                    "trivy",
                    "secret",
                    ruleId,
                    category,
                    target,
                    line || "",
                    endLine || ""
                  ]),
                  severity: trivySeverity[String(secret.Severity || "UNKNOWN").toUpperCase()] || "info",
                  ruleId,
                  path: target,
                  line,
                  title,
                  description: boundedText(
                    category
                      ? `Potential ${category} secret detected by Trivy`
                      : `Potential secret detected by Trivy rule ${ruleId}`,
                    title
                  )
                });
              }
              for (const license of result.Licenses || []) {
                const packageName = String(license.PkgName || "");
                const installedVersion = String(license.InstalledVersion || "");
                const licenseName = String(license.Name || license.Category || "unknown-license");
                findings.push({
                  source: "trivy",
                  scannerClass: "license",
                  ...fingerprintFields([
                    "trivy",
                    "license",
                    packageName,
                    installedVersion,
                    licenseName,
                    target
                  ]),
                  severity: trivySeverity[String(license.Severity || "UNKNOWN").toUpperCase()] || "info",
                  ruleId: licenseName,
                  path: target,
                  packageName,
                  installedVersion,
                  title: boundedText(licenseName, "unknown-license"),
                  description: boundedText(
                    license.Category
                      ? `License classification ${license.Category}`
                      : `Detected license ${licenseName}`,
                    licenseName
                  )
                });
              }
            }
            return findings;
          };

          const baselineDocument = (raw) => {
            if (Array.isArray(raw)) return raw;
            if (raw && typeof raw === "object" && Array.isArray(raw.fingerprints)) return raw.fingerprints;
            throw new Error("baseline must be an array or an object with a fingerprints array");
          };

          const summarizeFinding = (finding) => {
            if (finding.source === "semgrep") {
              return `Semgrep ${finding.ruleId} at ${finding.path}:${finding.line}`;
            }
            const suffix = finding.line ? `:${finding.line}` : "";
            if (finding.scannerClass === "misconfiguration") {
              return `Trivy misconfiguration ${finding.ruleId} at ${finding.path}${suffix}`;
            }
            if (finding.scannerClass === "secret") {
              return `Trivy secret ${finding.ruleId} at ${finding.path}${suffix}`;
            }
            return `Trivy vulnerability ${finding.ruleId} in ${finding.packageName}; fixed by ${finding.fixedVersion}`;
          };

          const semgrep = JSON.parse(fs.readFileSync("guardianbot-evidence/semgrep.json", "utf8"));
          const trivy = JSON.parse(fs.readFileSync("guardianbot-evidence/trivy.json", "utf8"));
          const executionFailures = [];
          if (semgrep.scanner_error) executionFailures.push("Semgrep failed or evidence is missing");
          if (trivy.scanner_error) executionFailures.push("Trivy failed or evidence is missing");

          const suppressionRecords = JSON.parse(
            fs.readFileSync("guardianbot-evidence/suppressions.json", "utf8")
          );
          if (!Array.isArray(suppressionRecords)) {
            throw new Error("suppressions must be an array");
          }
          const now = Date.now();
          const expiredSuppressions = [];
          const invalidSuppressions = [];
          const suppressions = new Set();
          for (const suppression of suppressionRecords) {
            const expiresAt = Date.parse(String(suppression?.expiresAt || ""));
            if (
              !suppression ||
              typeof suppression.fingerprint !== "string" ||
              !suppression.fingerprint ||
              !Number.isFinite(expiresAt)
            ) {
              invalidSuppressions.push(String(suppression?.fingerprint || "unknown"));
              continue;
            }
            if (expiresAt <= now) {
              expiredSuppressions.push(suppression.fingerprint);
              continue;
            }
            suppressions.add(suppression.fingerprint);
          }
          if (invalidSuppressions.length) {
            executionFailures.push(
              `Invalid suppression records: ${invalidSuppressions.join(", ")}`
            );
          }

          let baselineFingerprints = new Set();
          if (process.env.SCANNER_MODE === "enforce") {
            const baselinePath = path.resolve(process.env.BASELINE_PATH);
            if (!fs.existsSync(baselinePath)) {
              executionFailures.push(`Baseline is required for enforce mode: ${process.env.BASELINE_PATH}`);
            } else {
              try {
                const baselineValues = baselineDocument(
                  JSON.parse(fs.readFileSync(baselinePath, "utf8"))
                ).map(String);
                const invalidFingerprints = baselineValues.filter(
                  (fingerprint) => !/^[a-f0-9]{64}$/.test(fingerprint)
                );
                if (invalidFingerprints.length) {
                  throw new Error(
                    `${invalidFingerprints.length} baseline fingerprint(s) are not lowercase SHA-256 values`
                  );
                }
                if (new Set(baselineValues).size !== baselineValues.length) {
                  throw new Error("baseline contains duplicate fingerprints");
                }
                baselineFingerprints = new Set(baselineValues);
                if (baselineFingerprints.size === 0) {
                  executionFailures.push(`Baseline is empty: ${process.env.BASELINE_PATH}`);
                }
              } catch (error) {
                executionFailures.push(`Invalid baseline document at ${process.env.BASELINE_PATH}: ${error.message}`);
              }
            }
          }

          let semgrepFindings = [];
          if (!semgrep.scanner_error) {
            try {
              validateSemgrepReport(semgrep);
              semgrepFindings = normalizeSemgrep(semgrep);
            } catch (error) {
              executionFailures.push(`Semgrep evidence is invalid: ${error.message}`);
            }
          }

          let trivyFindings = [];
          if (!trivy.scanner_error) {
            try {
              validateTrivyReport(trivy);
              trivyFindings = normalizeTrivy(trivy);
            } catch (error) {
              executionFailures.push(`Trivy evidence is invalid: ${error.message}`);
            }
          }

          const findings = [...semgrepFindings, ...trivyFindings];
          const observed = findings.filter(
            (finding) =>
              !baselineFingerprints.has(finding.fingerprint) &&
              !baselineFingerprints.has(finding.legacyFingerprint) &&
              !suppressions.has(finding.fingerprint) &&
              !suppressions.has(finding.legacyFingerprint)
          );
          const policyFindings = observed.filter((finding) => {
            if (finding.source === "semgrep") {
              return finding.severity === "critical" || finding.severity === "high";
            }
            if (finding.source === "trivy") {
              if (finding.scannerClass === "license") {
                return false;
              }
              if (finding.scannerClass === "misconfiguration" || finding.scannerClass === "secret") {
                return finding.severity === "critical" || finding.severity === "high";
              }
              return (
                (finding.severity === "critical" || finding.severity === "high") &&
                Boolean(finding.fixedVersion)
              );
            }
            return false;
          });

          const enforcedFindings = process.env.SCANNER_MODE === "enforce" ? policyFindings : [];
          const failures = [...executionFailures, ...enforcedFindings.map(summarizeFinding)];

          fs.writeFileSync("guardianbot-evidence/gate.json", JSON.stringify({
            schemaVersion: "1.0.0",
            mode: process.env.SCANNER_MODE,
            baselineRequired: process.env.SCANNER_MODE === "enforce",
            baselineCount: baselineFingerprints.size,
            passed: failures.length === 0,
            failures,
            policyFindings,
            activeSuppressions: suppressions.size,
            expiredSuppressions
          }, null, 2));

          const summaryLines = [
            "## GuardianBot security gate",
            "",
            `Mode: **${process.env.SCANNER_MODE}**`,
            "",
            `Baseline fingerprints: **${baselineFingerprints.size}**`,
            "",
            `Active suppressions: **${suppressions.size}**`
          ];
          if (expiredSuppressions.length) {
            summaryLines.push(
              "",
              ...expiredSuppressions.map((fingerprint) =>
                `- ⚠️ Suppression expired: \`${fingerprint}\``
              )
            );
          }
          if (executionFailures.length) {
            summaryLines.push("", ...executionFailures.map((item) => `- ❌ ${item}`));
          }
          if (policyFindings.length) {
            summaryLines.push(
              "",
              ...policyFindings.map((finding) => {
                const prefix = process.env.SCANNER_MODE === "enforce" ? "❌" : "⚠️";
                return `- ${prefix} ${summarizeFinding(finding)}`;
              })
            );
          } else if (!executionFailures.length) {
            summaryLines.push("", "- ✅ No qualifying findings");
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summaryLines.join("\n")}\n`);
          if (failures.length) process.exitCode = 1;
          NODE

      - name: Attest evidence provenance
        if: always() && steps.config.outcome == 'success' && steps.rule_pack.outcome == 'success'
        env:
          EVIDENCE_ARTIFACT_TYPE: security
          EVIDENCE_DIRECTORY: guardianbot-evidence
          EVIDENCE_FILES: gate.json,semgrep.json,trivy.json
          GUARDIANBOT_WORKFLOW_CHECKOUT: guardianbot-engine
          JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        shell: bash
        run: |
          node <<'NODE'
          (async () => {
          const crypto = require("node:crypto");
          const childProcess = require("node:child_process");
          const fs = require("node:fs");
          const path = require("node:path");

          const canonical = (value) => {
            if (value === null || typeof value === "boolean" ||
                typeof value === "number" || typeof value === "string") {
              return JSON.stringify(value);
            }
            if (Array.isArray(value)) return `[${value.map(canonical).join(",")}]`;
            return `{${Object.keys(value).sort().map((key) =>
              `${JSON.stringify(key)}:${canonical(value[key])}`).join(",")}}`;
          };
          const sha256 = (bytes) =>
            crypto.createHash("sha256").update(bytes).digest("hex");
          const workflowMatch = process.env.JOB_WORKFLOW_REF.match(
            /^([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)\/(\.github\/workflows\/[A-Za-z0-9._-]+\.ya?ml)@([a-f0-9]{40})$/i
          );
          if (!workflowMatch || workflowMatch[3].toLowerCase() !== process.env.JOB_WORKFLOW_SHA) {
            throw new Error("Reusable workflow identity is not pinned to its exact SHA");
          }
          const workflowCheckout = fs.realpathSync(process.env.GUARDIANBOT_WORKFLOW_CHECKOUT);
          const checkedOutSha = childProcess.execFileSync(
            "git", ["-C", workflowCheckout, "rev-parse", "HEAD"],
            { encoding: "utf8" }
          ).trim().toLowerCase();
          if (checkedOutSha !== process.env.JOB_WORKFLOW_SHA.toLowerCase()) {
            throw new Error("Deployment manifest checkout does not match the reusable workflow SHA");
          }
          const deploymentPath = path.join(workflowCheckout, "deployments", "production.json");
          const deploymentStat = fs.lstatSync(deploymentPath);
          if (!deploymentStat.isFile() || deploymentStat.isSymbolicLink() ||
              path.dirname(path.dirname(fs.realpathSync(deploymentPath))) !== workflowCheckout) {
            throw new Error("Deployment manifest must be a direct regular file in the trusted checkout");
          }
          const deployment = JSON.parse(fs.readFileSync(deploymentPath, "utf8"));
          if (!deployment || deployment.schemaVersion !== "1.0.0" ||
              deployment.environment !== "production" ||
              typeof deployment.evidenceAttestationUrl !== "string" ||
              Object.keys(deployment).sort().join(",") !==
                "environment,evidenceAttestationUrl,schemaVersion") {
            throw new Error("GuardianBot production deployment manifest is invalid");
          }
          const directoryStat = fs.lstatSync(process.env.EVIDENCE_DIRECTORY);
          if (!directoryStat.isDirectory() || directoryStat.isSymbolicLink()) {
            throw new Error("Evidence directory must be a real directory");
          }
          const evidenceDirectory = fs.realpathSync(process.env.EVIDENCE_DIRECTORY);
          const writeEvidenceOutput = (name, contents) => {
            const target = path.join(evidenceDirectory, name);
            try {
              const existing = fs.lstatSync(target);
              if (!existing.isFile() || existing.isSymbolicLink() ||
                  path.dirname(fs.realpathSync(target)) !== evidenceDirectory) {
                throw new Error(`Refusing to replace unsafe evidence output: ${name}`);
              }
              fs.unlinkSync(target);
            } catch (error) {
              if (!error || error.code !== "ENOENT") throw error;
            }
            fs.writeFileSync(target, contents, { mode: 0o600, flag: "wx" });
          };
          const names = process.env.EVIDENCE_FILES.split(",").filter(Boolean).sort();
          const files = names.map((name) => {
            if (!/^[A-Za-z0-9._-]+$/.test(name)) throw new Error("Invalid evidence filename");
            const filePath = path.join(evidenceDirectory, name);
            const stat = fs.lstatSync(filePath);
            if (!stat.isFile() || stat.isSymbolicLink() ||
                path.dirname(fs.realpathSync(filePath)) !== evidenceDirectory) {
              throw new Error(`Evidence file must be a direct regular file: ${name}`);
            }
            const bytes = fs.readFileSync(filePath);
            if (!bytes.length) throw new Error(`Evidence file is empty: ${name}`);
            return { path: name, sha256: sha256(bytes), size: bytes.length };
          });
          const manifest = {
            schemaVersion: "1.0.0",
            artifactType: process.env.EVIDENCE_ARTIFACT_TYPE,
            repository: process.env.GITHUB_REPOSITORY.toLowerCase(),
            repositoryId: Number(process.env.GITHUB_REPOSITORY_ID),
            runId: Number(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            headSha: process.env.GITHUB_SHA.toLowerCase(),
            workflowPath: workflowMatch[2],
            workflowSha: process.env.JOB_WORKFLOW_SHA.toLowerCase(),
            files
          };
          const manifestDigest = `sha256:${sha256(Buffer.from(canonical(manifest)))}`;
          writeEvidenceOutput(
            "provenance-manifest.json",
            `${JSON.stringify(manifest, null, 2)}\n`
          );
          const endpoint = new URL(deployment.evidenceAttestationUrl);
          if (endpoint.protocol !== "https:" || endpoint.pathname !== "/evidence/attest" ||
              endpoint.username || endpoint.password || endpoint.search || endpoint.hash) {
            throw new Error("Evidence attestation URL must be the HTTPS /evidence/attest endpoint");
          }
          const readJsonLimited = async (response, maximum) => {
            const declared = response.headers.get("content-length");
            if (declared !== null &&
                (!/^\d+$/.test(declared) || Number(declared) > maximum)) {
              throw new Error("JSON response exceeded its size limit");
            }
            if (!response.body) throw new Error("JSON response body is missing");
            const reader = response.body.getReader();
            const chunks = [];
            let received = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              received += value.byteLength;
              if (received > maximum) {
                await reader.cancel();
                throw new Error("JSON response exceeded its size limit");
              }
              chunks.push(Buffer.from(value));
            }
            return JSON.parse(Buffer.concat(chunks).toString("utf8"));
          };
          const oidcUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          oidcUrl.searchParams.set("audience", "guardianbot-evidence");
          const oidcResponse = await fetch(oidcUrl, {
            headers: { authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
            redirect: "error"
          });
          if (!oidcResponse.ok) throw new Error(`GitHub OIDC request failed: ${oidcResponse.status}`);
          const oidcToken = String(
            (await readJsonLimited(oidcResponse, 64 * 1024)).value || ""
          );
          if (!oidcToken) throw new Error("GitHub OIDC response omitted its token");
          const attestationResponse = await fetch(endpoint, {
            method: "POST",
            headers: {
              authorization: `Bearer ${oidcToken}`,
              "content-type": "application/json"
            },
            body: JSON.stringify({
              schemaVersion: "1.0.0",
              artifactType: manifest.artifactType,
              manifestDigest,
              repository: manifest.repository,
              repositoryId: manifest.repositoryId,
              runId: manifest.runId,
              runAttempt: manifest.runAttempt,
              headSha: manifest.headSha
            }),
            redirect: "error"
          });
          if (!attestationResponse.ok) {
            throw new Error(`Evidence attestation failed: ${attestationResponse.status}`);
          }
          const provenance = await readJsonLimited(
            attestationResponse,
            16 * 1024
          );
          if (typeof provenance.token !== "string" || !provenance.token.startsWith("gbp1.")) {
            throw new Error("Evidence attestation response is invalid");
          }
          writeEvidenceOutput("provenance-token.txt", `${provenance.token}\n`);
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exitCode = 1;
          });
          NODE

      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guardianbot-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: guardianbot-evidence/
          if-no-files-found: error
          retention-days: 30
