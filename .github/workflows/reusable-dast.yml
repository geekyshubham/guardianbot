name: GuardianBot reusable DAST

on:
  workflow_call:
    inputs:
      target-origin: { required: true, type: string }
      openapi: { required: true, type: string }
      openapi-source: { required: true, type: string }
      authentication-profile: { required: true, type: string }
      session-assertion-path: { required: true, type: string }
      excluded-routes: { required: false, type: string, default: "[]" }
      scan-profile: { required: true, type: string }
      minutes: { required: false, type: number, default: 45 }

permissions:
  contents: read

jobs:
  zap:
    name: authenticated staging DAST
    # Credentials are issued once by the control plane from an administrative
    # profile. No repository or environment secret is copied into the caller.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    environment: guardianbot-dast
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check out immutable GuardianBot deployment manifest
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: guardianbot-engine
          persist-credentials: false

      - name: Resolve and enforce exact staging contract
        id: contract
        env:
          AUTHENTICATION_PROFILE: ${{ inputs.authentication-profile }}
          EXCLUDED_ROUTES: ${{ inputs.excluded-routes }}
          OPENAPI: ${{ inputs.openapi }}
          OPENAPI_SOURCE: ${{ inputs.openapi-source }}
          SCAN_MINUTES: ${{ inputs.minutes }}
          SCAN_PROFILE: ${{ inputs.scan-profile }}
          TARGET_ORIGIN: ${{ inputs.target-origin }}
          SESSION_ASSERTION_PATH: ${{ inputs.session-assertion-path }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const invalidRemoteHost = (hostname) =>
            /(^localhost$)|(\.localhost$)|(\.local$)|(\.internal$)|(^127\.)|(^0\.)|(^10\.)|(^169\.254\.)|(^192\.168\.)|(^172\.(1[6-9]|2[0-9]|3[01])\.)|(^::1$)|(^f[cd][0-9a-f]:)|(^fe[89ab][0-9a-f]:)/i.test(hostname);

          const target = new URL(process.env.TARGET_ORIGIN);
          const minutes = Number(process.env.SCAN_MINUTES);
          if (!Number.isInteger(minutes) || minutes < 5 || minutes > 45) {
            throw new Error("DAST minutes must be an integer between 5 and 45");
          }
          if (target.protocol !== "https:" || target.username || target.password ||
              target.pathname !== "/" || target.search || target.hash ||
              invalidRemoteHost(target.hostname)) {
            throw new Error("Invalid remote target");
          }

          const sessionAssertionPath = process.env.SESSION_ASSERTION_PATH;
          if (!/^\/(?!\/)[^\s?#]*$/.test(sessionAssertionPath)) {
            throw new Error("session-assertion-path must be an origin-relative path");
          }
          if (!/^control-plane:\/\/profiles\/[A-Za-z0-9._/-]+$/.test(
                process.env.AUTHENTICATION_PROFILE) ||
              process.env.AUTHENTICATION_PROFILE.includes("..")) {
            throw new Error("authentication-profile must be an opaque control-plane profile");
          }
          if (!["authenticated-baseline", "authenticated-full"].includes(
                process.env.SCAN_PROFILE)) {
            throw new Error("scan-profile is invalid");
          }
          let excludedRoutes;
          try {
            excludedRoutes = JSON.parse(process.env.EXCLUDED_ROUTES);
          } catch {
            throw new Error("excluded-routes must be a JSON array");
          }
          if (!Array.isArray(excludedRoutes) || excludedRoutes.length > 100 ||
              excludedRoutes.some((route) =>
                typeof route !== "string" || !/^\/(?!\/)[^\s?#]*$/.test(route))) {
            throw new Error("excluded-routes contains an invalid route");
          }

          let openapiLocation;
          if (process.env.OPENAPI_SOURCE === "repository-file") {
            const candidate = process.env.OPENAPI;
            if (!/^[A-Za-z0-9._/-]+\.(?:json|ya?ml)$/i.test(candidate) ||
                candidate.split("/").includes("..")) {
              throw new Error("repository OpenAPI path is invalid");
            }
            const workspace = fs.realpathSync(process.env.GITHUB_WORKSPACE);
            const absolute = path.resolve(workspace, candidate);
            const stat = fs.lstatSync(absolute);
            if (!stat.isFile() || stat.isSymbolicLink() ||
                !fs.realpathSync(absolute).startsWith(`${workspace}${path.sep}`) ||
                stat.size < 1 || stat.size > 2 * 1024 * 1024) {
              throw new Error("repository OpenAPI file is unsafe or outside its size limit");
            }
            openapiLocation = absolute;
          } else if (process.env.OPENAPI_SOURCE === "live-endpoint") {
            const resolved = new URL(process.env.OPENAPI, target);
            if (resolved.protocol !== "https:" || resolved.origin !== target.origin ||
                resolved.username || resolved.password || resolved.hash) {
              throw new Error("live OpenAPI endpoint must be same-origin HTTPS");
            }
            openapiLocation = resolved.href;
          } else {
            throw new Error("openapi-source is invalid");
          }

          try {
            fs.lstatSync("guardianbot-dast-evidence");
            throw new Error("guardianbot-dast-evidence is a reserved workflow path");
          } catch (error) {
            if (!error || error.code !== "ENOENT") throw error;
          }
          fs.mkdirSync("guardianbot-dast-evidence", { mode: 0o700 });
          const contractPath = path.join(process.env.RUNNER_TEMP, "guardianbot-dast-contract.json");
          fs.writeFileSync(contractPath, JSON.stringify({
            schemaVersion: "1.0.0",
            origin: target.origin,
            openapiSource: process.env.OPENAPI_SOURCE,
            openapiLocation,
            authenticationProfile: process.env.AUTHENTICATION_PROFILE,
            sessionAssertionPath,
            excludedRoutes,
            scanProfile: process.env.SCAN_PROFILE,
            minutes
          }), { mode: 0o600, flag: "wx" });
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `contract-path=${contractPath}\n`);
          NODE

      - name: Resolve one-time session from control plane
        env:
          CONTRACT_PATH: ${{ steps.contract.outputs.contract-path }}
          GUARDIANBOT_WORKFLOW_CHECKOUT: guardianbot-engine
          JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        shell: bash
        run: |
          node <<'NODE'
          (async () => {
            const childProcess = require("node:child_process");
            const fs = require("node:fs");
            const path = require("node:path");
            const readJsonLimited = async (response, maximum) => {
              const declared = response.headers.get("content-length");
              if (declared !== null &&
                  (!/^\d+$/.test(declared) || Number(declared) > maximum)) {
                throw new Error("JSON response exceeded its size limit");
              }
              if (!response.body) throw new Error("JSON response body is missing");
              const reader = response.body.getReader();
              const chunks = [];
              let received = 0;
              while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                received += value.byteLength;
                if (received > maximum) {
                  await reader.cancel();
                  throw new Error("JSON response exceeded its size limit");
                }
                chunks.push(Buffer.from(value));
              }
              return JSON.parse(Buffer.concat(chunks).toString("utf8"));
            };
            const contract = JSON.parse(fs.readFileSync(process.env.CONTRACT_PATH, "utf8"));
            const workflowMatch = process.env.JOB_WORKFLOW_REF.match(
              /^([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)\/(\.github\/workflows\/[A-Za-z0-9._-]+\.ya?ml)@([a-f0-9]{40})$/i
            );
            if (!workflowMatch || workflowMatch[3].toLowerCase() !==
                process.env.JOB_WORKFLOW_SHA.toLowerCase()) {
              throw new Error("Reusable workflow identity is not pinned to its exact SHA");
            }
            const checkout = fs.realpathSync(process.env.GUARDIANBOT_WORKFLOW_CHECKOUT);
            const checkedOutSha = childProcess.execFileSync(
              "git", ["-C", checkout, "rev-parse", "HEAD"], { encoding: "utf8" }
            ).trim().toLowerCase();
            if (checkedOutSha !== process.env.JOB_WORKFLOW_SHA.toLowerCase()) {
              throw new Error("Deployment manifest checkout does not match the reusable workflow SHA");
            }
            const deploymentPath = path.join(checkout, "deployments", "production.json");
            const deploymentStat = fs.lstatSync(deploymentPath);
            if (!deploymentStat.isFile() || deploymentStat.isSymbolicLink() ||
                path.dirname(path.dirname(fs.realpathSync(deploymentPath))) !== checkout) {
              throw new Error("GuardianBot deployment manifest is unsafe");
            }
            const deployment = JSON.parse(fs.readFileSync(deploymentPath, "utf8"));
            if (!deployment || deployment.schemaVersion !== "1.0.0" ||
                deployment.environment !== "production" ||
                typeof deployment.evidenceAttestationUrl !== "string") {
              throw new Error("GuardianBot deployment manifest is invalid");
            }
            const evidenceEndpoint = new URL(deployment.evidenceAttestationUrl);
            if (evidenceEndpoint.protocol !== "https:" ||
                evidenceEndpoint.pathname !== "/evidence/attest" ||
                evidenceEndpoint.username || evidenceEndpoint.password ||
                evidenceEndpoint.search || evidenceEndpoint.hash) {
              throw new Error("GuardianBot evidence endpoint is invalid");
            }
            const sessionEndpoint = new URL("/dast/session", evidenceEndpoint);
            const fetchGithubOidc = async (url, init) => {
              let lastFailure = "unknown failure";
              for (let attempt = 1; attempt <= 4; attempt += 1) {
                try {
                  const response = await fetch(url, init);
                  if (
                    response.ok ||
                    (response.status !== 429 && response.status < 500) ||
                    attempt === 4
                  ) {
                    return response;
                  }
                  lastFailure = `HTTP ${response.status}`;
                  await response.arrayBuffer().catch(() => undefined);
                } catch (error) {
                  lastFailure = error instanceof Error ? error.message : String(error);
                  if (attempt === 4) {
                    throw new Error(
                      `GitHub OIDC request failed after ${attempt} attempts: ${lastFailure}`
                    );
                  }
                }
                await new Promise((resolve) =>
                  setTimeout(resolve, 500 * (2 ** (attempt - 1)))
                );
              }
              throw new Error(`GitHub OIDC request failed: ${lastFailure}`);
            };
            const oidcUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            oidcUrl.searchParams.set("audience", "guardianbot-dast-session");
            const oidcResponse = await fetchGithubOidc(oidcUrl, {
              headers: { authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
              redirect: "error"
            });
            if (!oidcResponse.ok) {
              throw new Error(`GitHub OIDC request failed: ${oidcResponse.status}`);
            }
            const oidcToken = String((await readJsonLimited(oidcResponse, 64 * 1024)).value || "");
            if (!oidcToken) throw new Error("GitHub OIDC response omitted its token");
            const sessionResponse = await fetch(sessionEndpoint, {
              method: "POST",
              headers: {
                authorization: `Bearer ${oidcToken}`,
                "content-type": "application/json"
              },
              body: JSON.stringify({
                schemaVersion: "1.0.0",
                profileRef: contract.authenticationProfile,
                origin: contract.origin,
                sessionAssertionPath: contract.sessionAssertionPath,
                repository: process.env.GITHUB_REPOSITORY.toLowerCase(),
                repositoryId: Number(process.env.GITHUB_REPOSITORY_ID),
                runId: Number(process.env.GITHUB_RUN_ID),
                runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
                headSha: process.env.GITHUB_SHA.toLowerCase()
              }),
              redirect: "error"
            });
            if (!sessionResponse.ok) {
              throw new Error(`DAST session resolution failed: ${sessionResponse.status}`);
            }
            const session = await readJsonLimited(sessionResponse, 16 * 1024);
            const allowedKeys = [
              "schemaVersion", "origin", "sessionAssertionPath", "headerName",
              "headerValue", "expiresAt", "assurance", "deploymentEnvironment",
              "deployedDigest"
            ];
            if (!session || typeof session !== "object" ||
                Object.keys(session).some((key) => !allowedKeys.includes(key)) ||
                session.schemaVersion !== "1.0.0" ||
                session.origin !== contract.origin ||
                typeof session.deploymentEnvironment !== "string" ||
                !/^[a-z][a-z0-9-]{0,62}$/.test(session.deploymentEnvironment) ||
                typeof session.deployedDigest !== "string" ||
                !/^sha256:[a-f0-9]{64}$/.test(session.deployedDigest) ||
                session.sessionAssertionPath !== contract.sessionAssertionPath ||
                typeof session.headerName !== "string" ||
                typeof session.headerValue !== "string" || !session.headerValue ||
                Buffer.byteLength(session.headerValue, "utf8") > 8 * 1024 ||
                /[\0\r\n]/.test(session.headerValue) ||
                !["target-exchanged", "poc-static"].includes(session.assurance)) {
              throw new Error("DAST session response is invalid");
            }
            const expiry = Date.parse(String(session.expiresAt || ""));
            if (!Number.isFinite(expiry) || expiry <= Date.now() + 30_000 ||
                expiry > Date.now() + 15 * 60_000) {
              throw new Error("DAST session expiry is invalid");
            }
            process.stdout.write(`::add-mask::${session.headerValue}\n`);
            const sessionPath = path.join(process.env.RUNNER_TEMP, "guardianbot-dast-session.json");
            fs.writeFileSync(sessionPath, JSON.stringify(session), { mode: 0o600, flag: "wx" });
            if (session.assurance === "poc-static") {
              process.stdout.write("::warning::DAST is using an explicitly authorized PoC static credential; target-enforced one-time expiry is unavailable.\n");
            }
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exitCode = 1;
          });
          NODE

      - name: Prepare bounded same-origin OpenAPI
        env:
          CONTRACT_PATH: ${{ steps.contract.outputs.contract-path }}
        shell: bash
        run: |
          openapi_source="$(jq -r '.openapiSource' "$CONTRACT_PATH")"
          openapi_location="$(jq -r '.openapiLocation' "$CONTRACT_PATH")"
          input_file="${RUNNER_TEMP}/guardianbot-openapi-input"
          if [ "$openapi_source" = "repository-file" ]; then
            cp -- "$openapi_location" "$input_file"
          else
            curl --fail --silent --show-error --proto '=https' --max-redirs 0 \
              --max-filesize 2097152 --output "$input_file" "$openapi_location"
          fi
          test -s "$input_file"
          test "$(wc -c < "$input_file")" -le 2097152
          chmod 600 "$input_file"
          docker run --rm --interactive --user "$(id -u):$(id -g)" --entrypoint python3 \
            -v "${RUNNER_TEMP}:/guardian-input:rw" \
            ghcr.io/zaproxy/zaproxy:stable@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2 \
            - /guardian-input/guardianbot-openapi-input \
              /guardian-input/guardianbot-openapi-safe.json \
              /guardian-input/guardianbot-dast-contract.json <<'PY'
          import json
          import os
          import sys
          from urllib.parse import urljoin, urlparse
          source_path, output_path, contract_path = sys.argv[1:]
          with open(contract_path, "r", encoding="utf-8") as handle:
              contract = json.load(handle)
          with open(source_path, "r", encoding="utf-8") as handle:
              source = handle.read()
          try:
              document = json.loads(source)
          except json.JSONDecodeError:
              import yaml
              document = yaml.safe_load(source)
          if not isinstance(document, dict):
              raise SystemExit("OpenAPI document must be an object")
          version = document.get("openapi") or document.get("swagger")
          if not isinstance(version, str):
              raise SystemExit("OpenAPI document omits its version")

          def walk(value):
              if isinstance(value, dict):
                  for key, item in value.items():
                      if key == "$ref" and (
                          not isinstance(item, str) or not item.startswith("#/")
                      ):
                          raise SystemExit("External OpenAPI references are prohibited")
                      yield from walk(item)
              elif isinstance(value, list):
                  for item in value:
                      yield from walk(item)

          list(walk(document))
          expected_origin = urlparse(contract["origin"])
          exact_origin = (
              f"{expected_origin.scheme}://{expected_origin.netloc}"
          )

          def validate_servers(servers):
              if not isinstance(servers, list) or not servers:
                  raise SystemExit("OpenAPI server list is invalid")
              for server in servers:
                  if not isinstance(server, dict) or not isinstance(
                      server.get("url"), str
                  ):
                      raise SystemExit("OpenAPI server entry is invalid")
                  resolved = urlparse(urljoin(f"{exact_origin}/", server["url"]))
                  if (
                      (resolved.scheme, resolved.netloc) != (
                          expected_origin.scheme, expected_origin.netloc
                      )
                      or resolved.username
                      or resolved.password
                      or resolved.query
                      or resolved.fragment
                  ):
                      raise SystemExit(
                          "OpenAPI server escapes the exact staging origin"
                      )

          if "servers" in document:
              validate_servers(document["servers"])

          swagger_document = "swagger" in document and "openapi" not in document
          if swagger_document:
              host = document.get("host")
              if host is not None and (
                  not isinstance(host, str) or host != expected_origin.netloc
              ):
                  raise SystemExit(
                      "OpenAPI server escapes the exact staging origin"
                  )
              schemes = document.get("schemes")
              if schemes is not None and (
                  not isinstance(schemes, list)
                  or not schemes
                  or any(scheme != "https" for scheme in schemes)
              ):
                  raise SystemExit(
                      "OpenAPI server escapes the exact staging origin"
                  )
              base_path = document.get("basePath")
              if base_path is not None and (
                  not isinstance(base_path, str)
                  or not base_path.startswith("/")
                  or base_path.startswith("//")
                  or "?" in base_path
                  or "#" in base_path
              ):
                  raise SystemExit("Swagger basePath is invalid")
              document["host"] = expected_origin.netloc
              document["schemes"] = ["https"]
              document.pop("servers", None)
          else:
              document["servers"] = [{"url": exact_origin}]

          def validate_operation_server_overrides(path_item):
              if "servers" in path_item:
                  validate_servers(path_item["servers"])
              for value in path_item.values():
                  if isinstance(value, dict) and "servers" in value:
                      validate_servers(value["servers"])

          safe_methods = ("get", "head", "options")
          retained_metadata = ("summary", "description", "parameters")

          def safe_path_item(path_item):
              if not isinstance(path_item, dict):
                  raise SystemExit("OpenAPI path item must be an object")
              validate_operation_server_overrides(path_item)
              safe_item = {
                  key: path_item[key]
                  for key in retained_metadata
                  if key in path_item
              }
              retained_methods = 0
              for method in safe_methods:
                  if method not in path_item:
                      continue
                  operation = path_item[method]
                  if not isinstance(operation, dict):
                      raise SystemExit("OpenAPI operation must be an object")
                  operation = dict(operation)
                  operation.pop("servers", None)
                  operation.pop("schemes", None)
                  safe_item[method] = operation
                  retained_methods += 1
              return safe_item if retained_methods else None

          paths = document.get("paths")
          if not isinstance(paths, dict):
              raise SystemExit("OpenAPI document omits paths")
          excluded = tuple(
              route if route == "/" else route.rstrip("/")
              for route in contract["excludedRoutes"]
          )
          safe_paths = {}
          for route, operations in paths.items():
              if not isinstance(route, str) or not route.startswith("/"):
                  continue
              if any(
                  route == blocked or (
                      blocked != "/" and route.startswith(f"{blocked}/")
                  )
                  for blocked in excluded
              ):
                  continue
              safe_operations = safe_path_item(operations)
              if safe_operations is not None:
                  safe_paths[route] = safe_operations

          if not safe_paths:
              raise SystemExit(
                  "OpenAPI contains no safe, non-excluded operations"
              )
          document["paths"] = safe_paths
          document.pop("webhooks", None)
          with open(output_path, "w", encoding="utf-8") as handle:
              json.dump(document, handle, separators=(",", ":"), sort_keys=True)
          os.chmod(output_path, 0o600)
          PY
          test -s "${RUNNER_TEMP}/guardianbot-openapi-safe.json"

      - name: Require authenticated assertion and run ZAP API scan
        env:
          CONTRACT_PATH: ${{ steps.contract.outputs.contract-path }}
        shell: bash
        run: |
          session_file="${RUNNER_TEMP}/guardianbot-dast-session.json"
          openapi_file="${RUNNER_TEMP}/guardianbot-openapi-safe.json"
          header_name="$(jq -r '.headerName' "$session_file")"
          header_value="$(jq -r '.headerValue' "$session_file")"
          target_origin="$(jq -r '.origin' "$session_file")"
          assertion_path="$(jq -r '.sessionAssertionPath' "$session_file")"
          scan_minutes="$(jq -r '.minutes' "$CONTRACT_PATH")"
          scan_profile="$(jq -r '.scanProfile' "$CONTRACT_PATH")"
          wall_seconds="$((scan_minutes * 60 + 180))"
          echo "::add-mask::${header_value}"

          unauthenticated_status="$(
            curl --silent --show-error --proto '=https' --max-redirs 0 \
              --output /dev/null --write-out '%{http_code}' \
              "${target_origin}${assertion_path}"
          )"
          case "$unauthenticated_status" in
            401|403) ;;
            *)
              echo "Session assertion endpoint must reject unauthenticated access."
              exit 1
              ;;
          esac
          authenticated_status="$(
            curl --silent --show-error --proto '=https' --max-redirs 0 \
              --output /dev/null --write-out '%{http_code}' \
              --header "${header_name}: ${header_value}" \
              "${target_origin}${assertion_path}"
          )"
          case "$authenticated_status" in
            2??) ;;
            *)
              echo "Authenticated session assertion failed."
              exit 1
              ;;
          esac

          options_file="${RUNNER_TEMP}/guardianbot-zap-options"
          install -m 600 /dev/null "$options_file"
          GUARDIANBOT_HEADER_NAME="$header_name" \
          GUARDIANBOT_HEADER_VALUE="$header_value" \
          GUARDIANBOT_SCAN_MINUTES="$scan_minutes" python3 - <<'PY'
          import os
          import shlex
          options = [
            "-config", "replacer.full_list(0).description=guardianbot-session",
            "-config", "replacer.full_list(0).enabled=true",
            "-config", "replacer.full_list(0).matchtype=REQ_HEADER",
            "-config", f"replacer.full_list(0).matchstr={os.environ['GUARDIANBOT_HEADER_NAME']}",
            "-config", "replacer.full_list(0).regex=false",
            "-config", f"replacer.full_list(0).replacement={os.environ['GUARDIANBOT_HEADER_VALUE']}",
            "-config", f"scanner.maxScanDurationInMins={os.environ['GUARDIANBOT_SCAN_MINUTES']}",
            "-config", f"scanner.maxRuleDurationInMins={os.environ['GUARDIANBOT_SCAN_MINUTES']}",
          ]
          with open(os.path.join(os.environ["RUNNER_TEMP"], "guardianbot-zap-options"), "w", encoding="utf-8") as handle:
            handle.write(" ".join(shlex.quote(option) for option in options))
          PY
          zap_work_dir="${RUNNER_TEMP}/guardianbot-zap-work"
          zap_input_dir="${RUNNER_TEMP}/guardianbot-zap-input"
          if [ -e "$zap_work_dir" ] || [ -L "$zap_work_dir" ] ||
             [ -e "$zap_input_dir" ] || [ -L "$zap_input_dir" ]; then
            echo "Reserved ZAP path already exists."
            exit 1
          fi
          install -d -m 700 "$zap_work_dir" "$zap_input_dir"
          install -m 600 "$openapi_file" "$zap_input_dir/openapi-safe.json"
          zap_cid_file="${RUNNER_TEMP}/guardianbot-zap.cid"
          if [ -e "$zap_cid_file" ] || [ -L "$zap_cid_file" ]; then
            echo "Reserved ZAP container ID path already exists."
            exit 1
          fi
          zap_mode_args=()
          if [ "$scan_profile" = "authenticated-baseline" ]; then
            # zap-api-scan.py performs an active scan by default. Deploy smoke
            # is intentionally passive; the nightly full profile remains active.
            zap_mode_args=(-S)
          fi
          # The pinned ZAP image owns /zap and /home/zap as its non-root
          # `zap` user (uid/gid 1000). Keep its potentially sensitive runtime
          # logs outside the uploaded evidence directory and give it read-only
          # access to only the already sanitized OpenAPI document.
          sudo chown -R --no-dereference 1000:1000 "$zap_work_dir" "$zap_input_dir"
          set +e
          timeout --signal=TERM --kill-after=30s "${wall_seconds}s" \
          docker run --rm --user zap --cidfile "$zap_cid_file" \
            -v "$zap_work_dir:/zap/wrk:rw" \
            -v "$zap_input_dir:/zap/input:ro" \
            ghcr.io/zaproxy/zaproxy:stable@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2 zap-api-scan.py \
            -t /zap/input/openapi-safe.json -f openapi \
            -O "$target_origin" \
            -J zap.json -T "$scan_minutes" \
            "${zap_mode_args[@]}" \
            -z "$(cat "$options_file")"
          raw_zap_exit="$?"
          set -e
          if [ -s "$zap_cid_file" ]; then
            docker rm --force "$(cat "$zap_cid_file")" >/dev/null 2>&1 || true
          fi
          failure_kind=""
          case "$raw_zap_exit" in
            0|1|2) zap_exit="$raw_zap_exit" ;;
            124)
              zap_exit=3
              failure_kind="wall_clock_timeout"
              ;;
            *)
              zap_exit=3
              failure_kind="zap_operational_failure"
              ;;
          esac
          sudo chown -R --no-dereference "$(id -u):$(id -g)" "$zap_work_dir" "$zap_input_dir"
          zap_report="${zap_work_dir}/zap.json"
          report_is_valid=false
          if [ -f "$zap_report" ] && [ ! -L "$zap_report" ]; then
            zap_size="$(stat --format='%s' "$zap_report")"
            if [ "$zap_size" -gt 0 ] && [ "$zap_size" -le 52428800 ] &&
               jq empty "$zap_report" >/dev/null 2>&1; then
              report_is_valid=true
            fi
          fi
          if [ "$report_is_valid" = true ]; then
            install -m 600 "$zap_report" guardianbot-dast-evidence/zap.json
          else
            if [ -e "$zap_report" ]; then
              failure_kind="invalid_report"
            elif [ -z "$failure_kind" ]; then
              failure_kind="missing_report"
            fi
            zap_exit=3
            jq -n --arg failureKind "$failure_kind" '{
              site: [],
              guardianbot: {
                status: "operational_failure",
                failureKind: $failureKind
              }
            }' > guardianbot-dast-evidence/zap.json
          fi
          jq -n \
            --arg profile "$scan_profile" \
            --arg deploymentEnvironment "$(jq -r '.deploymentEnvironment' "$session_file")" \
            --arg deployedDigest "$(jq -r '.deployedDigest' "$session_file")" \
            --arg failureKind "$failure_kind" \
            --argjson minutes "$scan_minutes" \
            --argjson zapExitCode "$zap_exit" \
            '{
              schemaVersion: "1.0.0",
              profile: $profile,
              deploymentEnvironment: $deploymentEnvironment,
              deployedDigest: $deployedDigest,
              minutes: $minutes,
              zapExitCode: $zapExitCode
            } + if $failureKind == "" then {} else {
              failureKind: $failureKind
            } end' > guardianbot-dast-evidence/scan-status.json
          GUARDIANBOT_HEADER_VALUE="$header_value" python3 - <<'PY'
          import os
          from pathlib import Path

          secret = os.environ["GUARDIANBOT_HEADER_VALUE"]
          for path in Path("guardianbot-dast-evidence").glob("*"):
              if not path.is_file():
                  continue
              raw = path.read_bytes()
              if secret.encode() in raw:
                  path.write_bytes(raw.replace(secret.encode(), b"[REDACTED_SESSION]"))
          PY
          # ZAP uses 1/2 for policy findings and warnings. Those remain
          # report-only evidence; 3+ indicates an operational scan failure.
          if [ "$zap_exit" -ge 3 ]; then
            echo "ZAP failed operationally with exit code ${zap_exit}."
            exit "$zap_exit"
          fi

      - name: Destroy DAST session material
        if: always()
        shell: bash
        run: |
          for file in \
            "${RUNNER_TEMP}/guardianbot-dast-session.json" \
            "${RUNNER_TEMP}/guardianbot-zap-options" \
            "${RUNNER_TEMP}/guardianbot-zap.cid" \
            "${RUNNER_TEMP}/guardianbot-zap-work/zap.json" \
            "${RUNNER_TEMP}/guardianbot-zap-input/openapi-safe.json" \
            "${RUNNER_TEMP}/guardianbot-openapi-input" \
            "${RUNNER_TEMP}/guardianbot-openapi-safe.json" \
            "${RUNNER_TEMP}/guardianbot-dast-contract.json"; do
            [ ! -f "$file" ] || shred -u "$file" 2>/dev/null || rm -f "$file"
          done
          for directory in \
            "${RUNNER_TEMP}/guardianbot-zap-work" \
            "${RUNNER_TEMP}/guardianbot-zap-input"; do
            if [ -d "$directory" ] && [ ! -L "$directory" ]; then
              find "$directory" -depth -mindepth 1 -delete
              rmdir "$directory"
            fi
          done

      - name: Attest DAST evidence provenance
        if: always()
        env:
          EVIDENCE_ARTIFACT_TYPE: dast
          EVIDENCE_DIRECTORY: guardianbot-dast-evidence
          EVIDENCE_FILES: scan-status.json,zap.json
          GUARDIANBOT_WORKFLOW_CHECKOUT: guardianbot-engine
          JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        shell: bash
        run: |
          node <<'NODE'
          (async () => {
          const crypto = require("node:crypto");
          const childProcess = require("node:child_process");
          const fs = require("node:fs");
          const path = require("node:path");
          const canonical = (value) => {
            if (value === null || typeof value === "boolean" ||
                typeof value === "number" || typeof value === "string") return JSON.stringify(value);
            if (Array.isArray(value)) return `[${value.map(canonical).join(",")}]`;
            return `{${Object.keys(value).sort().map((key) =>
              `${JSON.stringify(key)}:${canonical(value[key])}`).join(",")}}`;
          };
          const sha256 = (bytes) => crypto.createHash("sha256").update(bytes).digest("hex");
          const workflowMatch = process.env.JOB_WORKFLOW_REF.match(
            /^([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)\/(\.github\/workflows\/[A-Za-z0-9._-]+\.ya?ml)@([a-f0-9]{40})$/i
          );
          if (!workflowMatch || workflowMatch[3].toLowerCase() !== process.env.JOB_WORKFLOW_SHA) {
            throw new Error("Reusable workflow identity is not pinned to its exact SHA");
          }
          const workflowCheckout = fs.realpathSync(process.env.GUARDIANBOT_WORKFLOW_CHECKOUT);
          const checkedOutSha = childProcess.execFileSync(
            "git", ["-C", workflowCheckout, "rev-parse", "HEAD"],
            { encoding: "utf8" }
          ).trim().toLowerCase();
          if (checkedOutSha !== process.env.JOB_WORKFLOW_SHA.toLowerCase()) {
            throw new Error("Deployment manifest checkout does not match the reusable workflow SHA");
          }
          const deploymentPath = path.join(workflowCheckout, "deployments", "production.json");
          const deploymentStat = fs.lstatSync(deploymentPath);
          if (!deploymentStat.isFile() || deploymentStat.isSymbolicLink() ||
              path.dirname(path.dirname(fs.realpathSync(deploymentPath))) !== workflowCheckout) {
            throw new Error("Deployment manifest must be a direct regular file in the trusted checkout");
          }
          const deployment = JSON.parse(fs.readFileSync(deploymentPath, "utf8"));
          if (!deployment || deployment.schemaVersion !== "1.0.0" ||
              deployment.environment !== "production" ||
              typeof deployment.evidenceAttestationUrl !== "string" ||
              Object.keys(deployment).sort().join(",") !==
                "environment,evidenceAttestationUrl,schemaVersion") {
            throw new Error("GuardianBot production deployment manifest is invalid");
          }
          const directoryStat = fs.lstatSync(process.env.EVIDENCE_DIRECTORY);
          if (!directoryStat.isDirectory() || directoryStat.isSymbolicLink()) {
            throw new Error("Evidence directory must be a real directory");
          }
          const evidenceDirectory = fs.realpathSync(process.env.EVIDENCE_DIRECTORY);
          const writeEvidenceOutput = (name, contents) => {
            const target = path.join(evidenceDirectory, name);
            try {
              const existing = fs.lstatSync(target);
              if (!existing.isFile() || existing.isSymbolicLink() ||
                  path.dirname(fs.realpathSync(target)) !== evidenceDirectory) {
                throw new Error(`Refusing to replace unsafe evidence output: ${name}`);
              }
              fs.unlinkSync(target);
            } catch (error) {
              if (!error || error.code !== "ENOENT") throw error;
            }
            fs.writeFileSync(target, contents, { mode: 0o600, flag: "wx" });
          };
          const files = process.env.EVIDENCE_FILES.split(",").filter(Boolean).sort().map((name) => {
            if (!/^[A-Za-z0-9._-]+$/.test(name)) throw new Error("Invalid evidence filename");
            const filePath = path.join(evidenceDirectory, name);
            const stat = fs.lstatSync(filePath);
            if (!stat.isFile() || stat.isSymbolicLink() ||
                path.dirname(fs.realpathSync(filePath)) !== evidenceDirectory) {
              throw new Error(`Evidence file must be a direct regular file: ${name}`);
            }
            const bytes = fs.readFileSync(filePath);
            if (!bytes.length) throw new Error(`Evidence file is empty: ${name}`);
            return { path: name, sha256: sha256(bytes), size: bytes.length };
          });
          const manifest = {
            schemaVersion: "1.0.0", artifactType: process.env.EVIDENCE_ARTIFACT_TYPE,
            repository: process.env.GITHUB_REPOSITORY.toLowerCase(),
            repositoryId: Number(process.env.GITHUB_REPOSITORY_ID),
            runId: Number(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            headSha: process.env.GITHUB_SHA.toLowerCase(),
            workflowPath: workflowMatch[2],
            workflowSha: process.env.JOB_WORKFLOW_SHA.toLowerCase(), files
          };
          const manifestDigest = `sha256:${sha256(Buffer.from(canonical(manifest)))}`;
          writeEvidenceOutput("provenance-manifest.json", `${JSON.stringify(manifest, null, 2)}\n`);
          const endpoint = new URL(deployment.evidenceAttestationUrl);
          if (endpoint.protocol !== "https:" || endpoint.pathname !== "/evidence/attest" ||
              endpoint.username || endpoint.password || endpoint.search || endpoint.hash) {
            throw new Error("Evidence attestation URL must be the HTTPS /evidence/attest endpoint");
          }
          const readJsonLimited = async (response, maximum) => {
            const declared = response.headers.get("content-length");
            if (declared !== null &&
                (!/^\d+$/.test(declared) || Number(declared) > maximum)) {
              throw new Error("JSON response exceeded its size limit");
            }
            if (!response.body) throw new Error("JSON response body is missing");
            const reader = response.body.getReader();
            const chunks = [];
            let received = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              received += value.byteLength;
              if (received > maximum) {
                await reader.cancel();
                throw new Error("JSON response exceeded its size limit");
              }
              chunks.push(Buffer.from(value));
            }
            return JSON.parse(Buffer.concat(chunks).toString("utf8"));
          };
          const fetchGithubOidc = async (url, init) => {
            let lastFailure = "unknown failure";
            for (let attempt = 1; attempt <= 4; attempt += 1) {
              try {
                const response = await fetch(url, init);
                if (
                  response.ok ||
                  (response.status !== 429 && response.status < 500) ||
                  attempt === 4
                ) {
                  return response;
                }
                lastFailure = `HTTP ${response.status}`;
                await response.arrayBuffer().catch(() => undefined);
              } catch (error) {
                lastFailure = error instanceof Error ? error.message : String(error);
                if (attempt === 4) {
                  throw new Error(
                    `GitHub OIDC request failed after ${attempt} attempts: ${lastFailure}`
                  );
                }
              }
              await new Promise((resolve) =>
                setTimeout(resolve, 500 * (2 ** (attempt - 1)))
              );
            }
            throw new Error(`GitHub OIDC request failed: ${lastFailure}`);
          };
          const oidcUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          oidcUrl.searchParams.set("audience", "guardianbot-evidence");
          const oidcResponse = await fetchGithubOidc(oidcUrl, {
            headers: { authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
            redirect: "error"
          });
          if (!oidcResponse.ok) throw new Error(`GitHub OIDC request failed: ${oidcResponse.status}`);
          const oidcToken = String(
            (await readJsonLimited(oidcResponse, 64 * 1024)).value || ""
          );
          if (!oidcToken) throw new Error("GitHub OIDC response omitted its token");
          const attestationResponse = await fetch(endpoint, {
            method: "POST",
            headers: { authorization: `Bearer ${oidcToken}`, "content-type": "application/json" },
            body: JSON.stringify({
              schemaVersion: "1.0.0", artifactType: manifest.artifactType, manifestDigest,
              repository: manifest.repository, repositoryId: manifest.repositoryId,
              runId: manifest.runId, runAttempt: manifest.runAttempt, headSha: manifest.headSha
            }),
            redirect: "error"
          });
          if (!attestationResponse.ok) throw new Error(`Evidence attestation failed: ${attestationResponse.status}`);
          const provenance = await readJsonLimited(
            attestationResponse,
            16 * 1024
          );
          if (typeof provenance.token !== "string" || !provenance.token.startsWith("gbp1.")) {
            throw new Error("Evidence attestation response is invalid");
          }
          writeEvidenceOutput("provenance-token.txt", `${provenance.token}\n`);
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exitCode = 1;
          });
          NODE

      - name: Upload DAST evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guardianbot-dast-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: guardianbot-dast-evidence/
          if-no-files-found: error
