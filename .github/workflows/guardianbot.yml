# Generated by guardianctl. Scanner logic remains in Geekyshubham/guardianbot.
name: GuardianBot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardianbot-security-gate:
    name: guardianbot/security-gate
    if: github.event_name != 'schedule' || github.event.schedule == '23 2 * * *'
    permissions:
      contents: read
      security-events: write
      actions: read
      id-token: write
    uses: Geekyshubham/guardianbot/.github/workflows/reusable-security.yml@7524547700e4c3994353f5c61d1625b2bd5e5428
    with:
      config-path: .guardianbot/config.yml

  guardianbot-image:
    name: guardianbot/image-security
    if: github.event_name != 'schedule' || github.event.schedule == '23 2 * * *'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: Geekyshubham/guardianbot/.github/workflows/reusable-image.yml@7524547700e4c3994353f5c61d1625b2bd5e5428
    with:
      dockerfile: "Dockerfile"
      context: "."
      image-name: "ghcr.io/geekyshubham/guardianbot"
      health-path: "/healthz"
      readiness-path: "/readyz"
      container-port: 3000
      dependent-services: ""
      ephemeral-env-keys: ""
      policy-mode: "report-only"
      promotion-mode: "enforce-only"
      runtime-env: |
          GUARDIANBOT_IMAGE_SMOKE=1
          NODE_ENV=test
      migration-command: ""
      smoke-command: ""
      push: false


