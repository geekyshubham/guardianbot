# Generated by guardianctl. Scanner logic remains in Geekyshubham/guardianbot.
name: GuardianBot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardianbot-security-gate:
    name: guardianbot/security-gate
    if: github.event_name != 'schedule' || github.event.schedule == '23 2 * * *'
    permissions:
      contents: read
      security-events: write
      actions: read
      id-token: write
    uses: Geekyshubham/guardianbot/.github/workflows/reusable-security.yml@24167b17e2a7f25f3edb252ab389e178b4392cfe
    with:
      config-path: .guardianbot/config.yml

  guardianbot-image:
    name: guardianbot/image-security
    if: github.event_name != 'schedule' || github.event.schedule == '23 2 * * *'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: Geekyshubham/guardianbot/.github/workflows/reusable-image.yml@24167b17e2a7f25f3edb252ab389e178b4392cfe
    with:
      dockerfile: "Dockerfile"
      context: "."
      image-name: "ghcr.io/geekyshubham/guardianbot"
      health-path: "/api/v1/health/"
      readiness-path: "/ready"
      container-port: 8000
      dependent-services: "postgres,redis"
      ephemeral-env-keys: ""
      runtime-env: |
          # No runtime environment values configured.
      migration-command: ""
      smoke-command: ""
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}


