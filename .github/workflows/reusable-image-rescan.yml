name: GuardianBot reusable deployed image rescan

# Why a separate reusable workflow: the nightly rescan targets the exact digest that is already
# running, never a fresh build. It must not share reusable-image.yml because that workflow builds
# and (on the default-branch push) pushes, signs, and deploys. This job holds only read access to
# the registry, resolves the digest from accepted control-plane deployment evidence (never from a
# tag or caller input), verifies the existing signature and SBOM attestation, rescans, and emits
# provenance-bound evidence. It never pushes, signs, promotes, or touches the running deployment.

on:
  workflow_call:
    inputs:
      image-name: { required: true, type: string }
      deployment-environment: { required: true, type: string }

permissions:
  contents: read

jobs:
  rescan:
    name: deployed digest rescan
    if: github.event_name == 'schedule'
    environment: guardianbot-image-rescan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Check out immutable GuardianBot deployment manifest
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: guardianbot-engine
          persist-credentials: false
      - name: Prepare private rescan evidence directory
        run: |
          if [ -e guardianbot-image-rescan-evidence ] || [ -L guardianbot-image-rescan-evidence ]; then
            echo "guardianbot-image-rescan-evidence is a reserved workflow path."
            exit 1
          fi
          install -d -m 700 guardianbot-image-rescan-evidence
      - name: Resolve exact deployed digest from control plane
        id: target
        env:
          INPUT_DEPLOYMENT_ENVIRONMENT: ${{ inputs.deployment-environment }}
          INPUT_IMAGE_NAME: ${{ inputs.image-name }}
          GUARDIANBOT_WORKFLOW_CHECKOUT: guardianbot-engine
          JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        shell: bash
        run: |
          node <<'NODE'
          (async () => {
            const childProcess = require("node:child_process");
            const fs = require("node:fs");
            const path = require("node:path");
            const readJsonLimited = async (response, maximum) => {
              const declared = response.headers.get("content-length");
              if (declared !== null &&
                  (!/^\d+$/.test(declared) || Number(declared) > maximum)) {
                throw new Error("JSON response exceeded its size limit");
              }
              if (!response.body) throw new Error("JSON response body is missing");
              const reader = response.body.getReader();
              const chunks = [];
              let received = 0;
              while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                received += value.byteLength;
                if (received > maximum) {
                  await reader.cancel();
                  throw new Error("JSON response exceeded its size limit");
                }
                chunks.push(Buffer.from(value));
              }
              return JSON.parse(Buffer.concat(chunks).toString("utf8"));
            };
            const environment = process.env.INPUT_DEPLOYMENT_ENVIRONMENT;
            if (!/^[a-z][a-z0-9-]{0,62}$/.test(environment)) {
              throw new Error("deployment-environment is invalid");
            }
            const imageName = String(process.env.INPUT_IMAGE_NAME || "").toLowerCase();
            if (!/^[a-z0-9][a-z0-9._:/-]{0,254}$/.test(imageName) || imageName.includes("@")) {
              throw new Error("image-name is invalid");
            }
            const workflowMatch = process.env.JOB_WORKFLOW_REF.match(
              /^([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)\/(\.github\/workflows\/[A-Za-z0-9._-]+\.ya?ml)@([a-f0-9]{40})$/i
            );
            if (!workflowMatch || workflowMatch[3].toLowerCase() !==
                process.env.JOB_WORKFLOW_SHA.toLowerCase()) {
              throw new Error("Reusable workflow identity is not pinned to its exact SHA");
            }
            const checkout = fs.realpathSync(process.env.GUARDIANBOT_WORKFLOW_CHECKOUT);
            const checkedOutSha = childProcess.execFileSync(
              "git", ["-C", checkout, "rev-parse", "HEAD"], { encoding: "utf8" }
            ).trim().toLowerCase();
            if (checkedOutSha !== process.env.JOB_WORKFLOW_SHA.toLowerCase()) {
              throw new Error("Deployment manifest checkout does not match the reusable workflow SHA");
            }
            const deploymentPath = path.join(checkout, "deployments", "production.json");
            const deploymentStat = fs.lstatSync(deploymentPath);
            if (!deploymentStat.isFile() || deploymentStat.isSymbolicLink() ||
                path.dirname(path.dirname(fs.realpathSync(deploymentPath))) !== checkout) {
              throw new Error("GuardianBot deployment manifest is unsafe");
            }
            const deployment = JSON.parse(fs.readFileSync(deploymentPath, "utf8"));
            if (!deployment || deployment.schemaVersion !== "1.0.0" ||
                deployment.environment !== "production" ||
                typeof deployment.evidenceAttestationUrl !== "string") {
              throw new Error("GuardianBot deployment manifest is invalid");
            }
            const evidenceEndpoint = new URL(deployment.evidenceAttestationUrl);
            if (evidenceEndpoint.protocol !== "https:" ||
                evidenceEndpoint.pathname !== "/evidence/attest" ||
                evidenceEndpoint.username || evidenceEndpoint.password ||
                evidenceEndpoint.search || evidenceEndpoint.hash) {
              throw new Error("GuardianBot evidence endpoint is invalid");
            }
            const targetEndpoint = new URL("/image/rescan-target", evidenceEndpoint);
            const fetchGithubOidc = async (url, init) => {
              let lastFailure = "unknown failure";
              for (let attempt = 1; attempt <= 4; attempt += 1) {
                try {
                  const response = await fetch(url, init);
                  if (
                    response.ok ||
                    (response.status !== 429 && response.status < 500) ||
                    attempt === 4
                  ) {
                    return response;
                  }
                  lastFailure = `HTTP ${response.status}`;
                  await response.arrayBuffer().catch(() => undefined);
                } catch (error) {
                  lastFailure = error instanceof Error ? error.message : String(error);
                  if (attempt === 4) {
                    throw new Error(
                      `GitHub OIDC request failed after ${attempt} attempts: ${lastFailure}`
                    );
                  }
                }
                await new Promise((resolve) =>
                  setTimeout(resolve, 500 * (2 ** (attempt - 1)))
                );
              }
              throw new Error(`GitHub OIDC request failed: ${lastFailure}`);
            };
            const oidcUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            oidcUrl.searchParams.set("audience", "guardianbot-image-rescan");
            const oidcResponse = await fetchGithubOidc(oidcUrl, {
              headers: { authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
              redirect: "error"
            });
            if (!oidcResponse.ok) {
              throw new Error(`GitHub OIDC request failed: ${oidcResponse.status}`);
            }
            const oidcToken = String((await readJsonLimited(oidcResponse, 64 * 1024)).value || "");
            if (!oidcToken) throw new Error("GitHub OIDC response omitted its token");
            const targetResponse = await fetch(targetEndpoint, {
              method: "POST",
              headers: {
                authorization: `Bearer ${oidcToken}`,
                "content-type": "application/json"
              },
              body: JSON.stringify({
                schemaVersion: "1.0.0",
                repository: process.env.GITHUB_REPOSITORY.toLowerCase(),
                repositoryId: Number(process.env.GITHUB_REPOSITORY_ID),
                runId: Number(process.env.GITHUB_RUN_ID),
                runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
                headSha: process.env.GITHUB_SHA.toLowerCase(),
                environment
              }),
              redirect: "error"
            });
            if (!targetResponse.ok) {
              // Fail closed: no accepted signed deployment means there is no digest to rescan.
              throw new Error(`Deployed digest resolution failed: ${targetResponse.status}`);
            }
            const target = await readJsonLimited(targetResponse, 16 * 1024);
            const allowedKeys = [
              "schemaVersion", "environment", "imageDigest", "imageReference",
              "certificateIdentity", "deploymentRunId", "deploymentRunAttempt",
              "deploymentHeadSha", "deployedAt"
            ];
            const identityMatch = String(target?.certificateIdentity ?? "").match(
              /^https:\/\/github\.com\/([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)\/\.github\/workflows\/reusable-image\.yml@([a-f0-9]{40})$/
            );
            if (!target || typeof target !== "object" || Array.isArray(target) ||
                Object.keys(target).sort().join(",") !== [...allowedKeys].sort().join(",") ||
                target.schemaVersion !== "1.0.0" ||
                target.environment !== environment ||
                typeof target.imageDigest !== "string" ||
                !/^sha256:[a-f0-9]{64}$/.test(target.imageDigest) ||
                typeof target.imageReference !== "string" ||
                target.imageReference.toLowerCase() !== `${imageName}@${target.imageDigest}` ||
                !identityMatch ||
                identityMatch[1].toLowerCase() !== workflowMatch[1].toLowerCase() ||
                !Number.isSafeInteger(target.deploymentRunId) || target.deploymentRunId <= 0 ||
                !Number.isSafeInteger(target.deploymentRunAttempt) ||
                target.deploymentRunAttempt <= 0 ||
                typeof target.deploymentHeadSha !== "string" ||
                !/^[a-f0-9]{40}$/.test(target.deploymentHeadSha) ||
                !Number.isFinite(Date.parse(String(target.deployedAt ?? "")))) {
              throw new Error("Deployed digest response is invalid");
            }
            const targetPath = path.join(process.env.RUNNER_TEMP, "guardianbot-rescan-target.json");
            fs.writeFileSync(targetPath, JSON.stringify(target), { mode: 0o600, flag: "wx" });
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `target-path=${targetPath}\n`);
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exitCode = 1;
          });
          NODE
      - name: Authenticate GHCR read-only
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
      - name: Verify deployed signature and previous SBOM attestation
        env:
          TARGET_PATH: ${{ steps.target.outputs.target-path }}
        run: |
          set -euo pipefail
          image_reference="$(jq -r '.imageReference' "$TARGET_PATH")"
          certificate_identity="$(jq -r '.certificateIdentity' "$TARGET_PATH")"
          cosign verify --output json "$image_reference" \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            | jq -s '[.[] | if type == "array" then .[] else . end]' \
            > guardianbot-image-rescan-evidence/cosign-verification.json
          jq -e 'type == "array" and length > 0' \
            guardianbot-image-rescan-evidence/cosign-verification.json >/dev/null
          # The verified CycloneDX attestation carries the SBOM recorded at promotion time. The
          # control plane extracts that predicate and diffs it against the fresh SBOM below.
          cosign verify-attestation --output json --type cyclonedx "$image_reference" \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            | jq -s '[.[] | if type == "array" then .[] else . end]' \
            > guardianbot-image-rescan-evidence/sbom-attestation-verification.json
          jq -e 'type == "array" and length > 0' \
            guardianbot-image-rescan-evidence/sbom-attestation-verification.json >/dev/null
      - name: Pull exact deployed digest
        env:
          TARGET_PATH: ${{ steps.target.outputs.target-path }}
        run: |
          set -euo pipefail
          image_reference="$(jq -r '.imageReference' "$TARGET_PATH")"
          docker pull --platform linux/amd64 "$image_reference"
          docker image inspect --format '{{json .RepoDigests}}' "$image_reference" |
            jq -e --arg reference "$image_reference" \
              'map(ascii_downcase) | index($reference | ascii_downcase) != null' >/dev/null
      - name: Trivy rescan of deployed digest
        env:
          TARGET_PATH: ${{ steps.target.outputs.target-path }}
        run: |
          image_reference="$(jq -r '.imageReference' "$TARGET_PATH")"
          set +e
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/guardianbot-image-rescan-evidence:/evidence" aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
            image --format json --output /evidence/trivy-image.json \
            --scanners vuln,misconfig,secret --severity CRITICAL --exit-code 0 \
            "$image_reference"
          trivy_exit="$?"
          set -e
          if [ "$trivy_exit" -ne 0 ] ||
             ! jq -e 'type == "object"' guardianbot-image-rescan-evidence/trivy-image.json >/dev/null 2>&1; then
            jq -n --argjson exitCode "$trivy_exit" \
              '{scanner_error: true, exitCode: $exitCode}' \
              > guardianbot-image-rescan-evidence/trivy-image.json
          fi
      - name: Fresh CycloneDX SBOM from deployed digest
        env:
          TARGET_PATH: ${{ steps.target.outputs.target-path }}
        run: |
          set -euo pipefail
          image_reference="$(jq -r '.imageReference' "$TARGET_PATH")"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/guardianbot-image-rescan-evidence:/evidence" aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
            image --format cyclonedx --output /evidence/sbom.cdx.json \
            "$image_reference"
          test -s guardianbot-image-rescan-evidence/sbom.cdx.json
      - name: Record rescan summary
        env:
          TARGET_PATH: ${{ steps.target.outputs.target-path }}
        run: |
          set -euo pipefail
          critical_count="$(
            jq 'if .scanner_error == true then null else [.Results[]? |
              ((.Vulnerabilities // []) + (.Misconfigurations // []) + (.Secrets // []))[]? |
              select((.Severity // "") | ascii_upcase == "CRITICAL")] | length end' \
              guardianbot-image-rescan-evidence/trivy-image.json
          )"
          sbom_sha="$(sha256sum guardianbot-image-rescan-evidence/sbom.cdx.json | cut -d' ' -f1)"
          jq -n \
            --slurpfile target "$TARGET_PATH" \
            --argjson criticalFindings "$critical_count" \
            --arg sbomSha256 "$sbom_sha" \
            '{
              schemaVersion: "1.0.0",
              environment: $target[0].environment,
              imageDigest: $target[0].imageDigest,
              imageReference: $target[0].imageReference,
              certificateIdentity: $target[0].certificateIdentity,
              deploymentRunId: $target[0].deploymentRunId,
              deploymentRunAttempt: $target[0].deploymentRunAttempt,
              deploymentHeadSha: $target[0].deploymentHeadSha,
              criticalFindings: $criticalFindings,
              sbomSha256: $sbomSha256
            }' > guardianbot-image-rescan-evidence/rescan.json
      - name: Attest rescan evidence provenance
        if: always()
        env:
          EVIDENCE_ARTIFACT_TYPE: image-rescan
          EVIDENCE_DIRECTORY: guardianbot-image-rescan-evidence
          EVIDENCE_FILES: cosign-verification.json,rescan.json,sbom-attestation-verification.json,sbom.cdx.json,trivy-image.json
          GUARDIANBOT_WORKFLOW_CHECKOUT: guardianbot-engine
          JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        shell: bash
        run: |
          node <<'NODE'
          (async () => {
          const crypto = require("node:crypto");
          const childProcess = require("node:child_process");
          const fs = require("node:fs");
          const path = require("node:path");
          const canonical = (value) => {
            if (value === null || typeof value === "boolean" ||
                typeof value === "number" || typeof value === "string") return JSON.stringify(value);
            if (Array.isArray(value)) return `[${value.map(canonical).join(",")}]`;
            return `{${Object.keys(value).sort().map((key) =>
              `${JSON.stringify(key)}:${canonical(value[key])}`).join(",")}}`;
          };
          const sha256 = (bytes) => crypto.createHash("sha256").update(bytes).digest("hex");
          const workflowMatch = process.env.JOB_WORKFLOW_REF.match(
            /^([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)\/(\.github\/workflows\/[A-Za-z0-9._-]+\.ya?ml)@([a-f0-9]{40})$/i
          );
          if (!workflowMatch || workflowMatch[3].toLowerCase() !== process.env.JOB_WORKFLOW_SHA) {
            throw new Error("Reusable workflow identity is not pinned to its exact SHA");
          }
          const workflowCheckout = fs.realpathSync(process.env.GUARDIANBOT_WORKFLOW_CHECKOUT);
          const checkedOutSha = childProcess.execFileSync(
            "git", ["-C", workflowCheckout, "rev-parse", "HEAD"],
            { encoding: "utf8" }
          ).trim().toLowerCase();
          if (checkedOutSha !== process.env.JOB_WORKFLOW_SHA.toLowerCase()) {
            throw new Error("Deployment manifest checkout does not match the reusable workflow SHA");
          }
          const deploymentPath = path.join(workflowCheckout, "deployments", "production.json");
          const deploymentStat = fs.lstatSync(deploymentPath);
          if (!deploymentStat.isFile() || deploymentStat.isSymbolicLink() ||
              path.dirname(path.dirname(fs.realpathSync(deploymentPath))) !== workflowCheckout) {
            throw new Error("Deployment manifest must be a direct regular file in the trusted checkout");
          }
          const deployment = JSON.parse(fs.readFileSync(deploymentPath, "utf8"));
          if (!deployment || deployment.schemaVersion !== "1.0.0" ||
              deployment.environment !== "production" ||
              typeof deployment.evidenceAttestationUrl !== "string" ||
              Object.keys(deployment).sort().join(",") !==
                "environment,evidenceAttestationUrl,schemaVersion") {
            throw new Error("GuardianBot production deployment manifest is invalid");
          }
          const directoryStat = fs.lstatSync(process.env.EVIDENCE_DIRECTORY);
          if (!directoryStat.isDirectory() || directoryStat.isSymbolicLink()) {
            throw new Error("Evidence directory must be a real directory");
          }
          const evidenceDirectory = fs.realpathSync(process.env.EVIDENCE_DIRECTORY);
          const writeEvidenceOutput = (name, contents) => {
            const target = path.join(evidenceDirectory, name);
            try {
              const existing = fs.lstatSync(target);
              if (!existing.isFile() || existing.isSymbolicLink() ||
                  path.dirname(fs.realpathSync(target)) !== evidenceDirectory) {
                throw new Error(`Refusing to replace unsafe evidence output: ${name}`);
              }
              fs.unlinkSync(target);
            } catch (error) {
              if (!error || error.code !== "ENOENT") throw error;
            }
            fs.writeFileSync(target, contents, { mode: 0o600, flag: "wx" });
          };
          const files = process.env.EVIDENCE_FILES.split(",").filter(Boolean).sort().map((name) => {
            if (!/^[A-Za-z0-9._-]+$/.test(name)) throw new Error("Invalid evidence filename");
            const filePath = path.join(evidenceDirectory, name);
            const stat = fs.lstatSync(filePath);
            if (!stat.isFile() || stat.isSymbolicLink() ||
                path.dirname(fs.realpathSync(filePath)) !== evidenceDirectory) {
              throw new Error(`Evidence file must be a direct regular file: ${name}`);
            }
            const bytes = fs.readFileSync(filePath);
            if (!bytes.length) throw new Error(`Evidence file is empty: ${name}`);
            return { path: name, sha256: sha256(bytes), size: bytes.length };
          });
          const manifest = {
            schemaVersion: "1.0.0", artifactType: process.env.EVIDENCE_ARTIFACT_TYPE,
            repository: process.env.GITHUB_REPOSITORY.toLowerCase(),
            repositoryId: Number(process.env.GITHUB_REPOSITORY_ID),
            runId: Number(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            headSha: process.env.GITHUB_SHA.toLowerCase(),
            workflowPath: workflowMatch[2],
            workflowSha: process.env.JOB_WORKFLOW_SHA.toLowerCase(), files
          };
          const manifestDigest = `sha256:${sha256(Buffer.from(canonical(manifest)))}`;
          writeEvidenceOutput("provenance-manifest.json", `${JSON.stringify(manifest, null, 2)}\n`);
          const endpoint = new URL(deployment.evidenceAttestationUrl);
          if (endpoint.protocol !== "https:" || endpoint.pathname !== "/evidence/attest" ||
              endpoint.username || endpoint.password || endpoint.search || endpoint.hash) {
            throw new Error("Evidence attestation URL must be the HTTPS /evidence/attest endpoint");
          }
          const readJsonLimited = async (response, maximum) => {
            const declared = response.headers.get("content-length");
            if (declared !== null &&
                (!/^\d+$/.test(declared) || Number(declared) > maximum)) {
              throw new Error("JSON response exceeded its size limit");
            }
            if (!response.body) throw new Error("JSON response body is missing");
            const reader = response.body.getReader();
            const chunks = [];
            let received = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              received += value.byteLength;
              if (received > maximum) {
                await reader.cancel();
                throw new Error("JSON response exceeded its size limit");
              }
              chunks.push(Buffer.from(value));
            }
            return JSON.parse(Buffer.concat(chunks).toString("utf8"));
          };
          const fetchGithubOidc = async (url, init) => {
            let lastFailure = "unknown failure";
            for (let attempt = 1; attempt <= 4; attempt += 1) {
              try {
                const response = await fetch(url, init);
                if (
                  response.ok ||
                  (response.status !== 429 && response.status < 500) ||
                  attempt === 4
                ) {
                  return response;
                }
                lastFailure = `HTTP ${response.status}`;
                await response.arrayBuffer().catch(() => undefined);
              } catch (error) {
                lastFailure = error instanceof Error ? error.message : String(error);
                if (attempt === 4) {
                  throw new Error(
                    `GitHub OIDC request failed after ${attempt} attempts: ${lastFailure}`
                  );
                }
              }
              await new Promise((resolve) =>
                setTimeout(resolve, 500 * (2 ** (attempt - 1)))
              );
            }
            throw new Error(`GitHub OIDC request failed: ${lastFailure}`);
          };
          const oidcUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          oidcUrl.searchParams.set("audience", "guardianbot-evidence");
          const oidcResponse = await fetchGithubOidc(oidcUrl, {
            headers: { authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
            redirect: "error"
          });
          if (!oidcResponse.ok) throw new Error(`GitHub OIDC request failed: ${oidcResponse.status}`);
          const oidcToken = String(
            (await readJsonLimited(oidcResponse, 64 * 1024)).value || ""
          );
          if (!oidcToken) throw new Error("GitHub OIDC response omitted its token");
          const attestationResponse = await fetch(endpoint, {
            method: "POST",
            headers: { authorization: `Bearer ${oidcToken}`, "content-type": "application/json" },
            body: JSON.stringify({
              schemaVersion: "1.0.0", artifactType: manifest.artifactType, manifestDigest,
              repository: manifest.repository, repositoryId: manifest.repositoryId,
              runId: manifest.runId, runAttempt: manifest.runAttempt, headSha: manifest.headSha
            }),
            redirect: "error"
          });
          if (!attestationResponse.ok) throw new Error(`Evidence attestation failed: ${attestationResponse.status}`);
          const provenance = await readJsonLimited(
            attestationResponse,
            16 * 1024
          );
          if (typeof provenance.token !== "string" || !provenance.token.startsWith("gbp1.")) {
            throw new Error("Evidence attestation response is invalid");
          }
          writeEvidenceOutput("provenance-token.txt", `${provenance.token}\n`);
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exitCode = 1;
          });
          NODE
      - name: Upload rescan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guardianbot-image-rescan-${{ github.run_id }}-${{ github.run_attempt }}
          path: guardianbot-image-rescan-evidence/
          if-no-files-found: error
