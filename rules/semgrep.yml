rules:
  - id: guardian.python.dynamic-code-execution
    languages: [python]
    severity: ERROR
    message: Dynamic Python code execution can turn untrusted text into arbitrary code.
    metadata:
      category: security
      cwe: CWE-95
      confidence: HIGH
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: guardian.python.shell-true
    languages: [python]
    severity: ERROR
    message: shell=True can allow command injection when any command fragment is untrusted.
    metadata:
      category: security
      cwe: CWE-78
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.check_call(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)

  - id: guardian.javascript.dynamic-code-execution
    languages: [javascript, typescript]
    severity: ERROR
    message: Dynamic JavaScript execution can turn untrusted text into arbitrary code.
    metadata:
      category: security
      cwe: CWE-95
      confidence: HIGH
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)

  - id: guardian.ruby.dynamic-code-execution
    languages: [ruby]
    severity: ERROR
    message: Dynamic Ruby code execution can turn untrusted text into arbitrary code.
    metadata:
      category: security
      cwe: CWE-95
      confidence: HIGH
    pattern-either:
      - pattern: eval(...)
      - pattern: instance_eval(...)
      - pattern: class_eval(...)

  - id: guardian.ruby.shell-string
    languages: [ruby]
    severity: WARNING
    message: A string shell command can allow command injection when it contains untrusted data.
    metadata:
      category: security
      cwe: CWE-78
      confidence: MEDIUM
    pattern-either:
      - pattern: system($COMMAND)
      - pattern: IO.popen($COMMAND, ...)
