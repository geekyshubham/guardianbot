schemaVersion: 1.0.0
workflowVersion: 359ee52824beead882330767f838a48e24766857
repository:
  defaultBranch: main
  releaseBranches:
    - main
  languages:
    - dockerfile
    - javascript
    - typescript
  relatedRepositories: []
review:
  automatic: true
  drafts: manual
  incremental: true
  maxInlineComments: 8
  categories:
    - security
    - logic
    - reliability
    - concurrency
    - performance
    - contract
    - testing
  highRiskPaths:
    - "**/auth/**"
    - "**/security/**"
    - "**/migrations/**"
    - .github/workflows/**
    - "**/Dockerfile*"
    - "**/*secret*"
    - "**/*tenant*"
  contextDocuments:
    - README.md
    - CONTRIBUTING.md
    - SECURITY.md
    - .github/CODEOWNERS
  excludedPaths:
    - "**/node_modules/**"
    - "**/vendor/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/*.min.js"
scanners:
  mode: report-only
  semgrep: true
  trivy: true
  suppressions: []
image:
  dockerfile: Dockerfile
  context: .
  platform: linux/amd64
  registry: ghcr.io/geekyshubham/guardianbot
  healthPath: /api/v1/health/
  readinessPath: /ready
  sbomFormat: cyclonedx-json
  dependentServices:
    - postgres
    - redis
dast: null
