schemaVersion: 1.0.0
workflowVersion: f2a7f5410bd5d8b140378a7c722b74ba0b455727
repository:
  defaultBranch: main
  releaseBranches:
    - main
  languages:
    - dockerfile
    - javascript
    - typescript
  relatedRepositories: []
review:
  automatic: true
  drafts: manual
  incremental: true
  maxInlineComments: 8
  categories:
    - security
    - logic
    - reliability
    - concurrency
    - performance
    - contract
    - testing
  highRiskPaths:
    - "**/auth/**"
    - "**/security/**"
    - "**/migrations/**"
    - .github/workflows/**
    - "**/Dockerfile*"
    - "**/*secret*"
    - "**/*tenant*"
  contextDocuments:
    - README.md
    - CONTRIBUTING.md
    - SECURITY.md
    - .github/CODEOWNERS
  excludedPaths:
    - "**/node_modules/**"
    - "**/vendor/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/*.min.js"
scanners:
  mode: report-only
  semgrep: true
  trivy: true
  suppressions: []
image:
  dockerfile: Dockerfile
  context: .
  platform: linux/amd64
  registry: ghcr.io/geekyshubham/guardianbot
  healthPath: /healthz
  readinessPath: /readyz
  containerPort: 3000
  sbomFormat: cyclonedx-json
  dependentServices: []
  runtimeEnvironment:
    GUARDIANBOT_IMAGE_SMOKE: "1"
    NODE_ENV: test
dast: null
