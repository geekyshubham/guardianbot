openapi: 3.1.0
info:
  title: GuardianBot safe staging surface
  version: 1.0.0
  description: Read-only operations approved for bounded staging DAST.
servers:
  - url: https://staging.example.com
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Read service health.
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/session:
    get:
      operationId: getSession
      summary: Confirm the authenticated staging session.
      responses:
        "200":
          description: Authenticated session details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Authentication is required.
components:
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Session:
      type: object
      additionalProperties: false
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
          const: true
