# Generated by guardianctl. Scanner logic remains in Acme/guardianbot.
name: GuardianBot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]
  schedule:
    - cron: "23 2 * * *"
    - cron: "*/15 * * * *"
    - cron: "47 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardianbot-security-gate:
    name: guardianbot/security-gate
    if: github.event_name != 'schedule' || github.event.schedule == '23 2 * * *'
    permissions:
      contents: read
      security-events: write
      actions: read
      id-token: write
    uses: Acme/guardianbot/.github/workflows/reusable-security.yml@cccccccccccccccccccccccccccccccccccccccc
    with:
      config-path: .guardianbot/config.yml

  guardianbot-image:
    name: guardianbot/image-security
    if: github.event_name != 'schedule' || github.event.schedule == '23 2 * * *'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: Acme/guardianbot/.github/workflows/reusable-image.yml@cccccccccccccccccccccccccccccccccccccccc
    with:
      dockerfile: "Dockerfile"
      context: "."
      image-name: "ghcr.io/acme/service"
      health-path: "/health"
      readiness-path: ""
      container-port: 8000
      dependent-services: ""
      ephemeral-env-keys: ""
      policy-mode: "enforce"
      promotion-mode: "enforce-only"
      runtime-env: |
          # No runtime environment values configured.
      migration-command: ""
      smoke-command: ""
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}


  guardianbot-dast-smoke:
    name: guardianbot/dast-smoke
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *')
    permissions:
      contents: read
      id-token: write
    uses: Acme/guardianbot/.github/workflows/reusable-dast.yml@cccccccccccccccccccccccccccccccccccccccc
    with:
      target-origin: "https://staging.example.com"
      openapi: "/openapi.json"
      openapi-source: "live-endpoint"
      authentication-profile: "staging-user"
      session-assertion-path: "/api/session"
      excluded-routes: "[]"
      scan-profile: "authenticated-baseline"
      minutes: 15

  guardianbot-dast-nightly:
    name: guardianbot/dast-nightly
    if: github.event_name == 'schedule' && github.event.schedule == '47 2 * * *'
    permissions:
      contents: read
      id-token: write
    uses: Acme/guardianbot/.github/workflows/reusable-dast.yml@cccccccccccccccccccccccccccccccccccccccc
    with:
      target-origin: "https://staging.example.com"
      openapi: "/openapi.json"
      openapi-source: "live-endpoint"
      authentication-profile: "staging-user"
      session-assertion-path: "/api/session"
      excluded-routes: "[]"
      scan-profile: "authenticated-full"
      minutes: 45

