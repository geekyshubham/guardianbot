name: guardianbot

services:
  control-plane:
    build:
      context: ..
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql://guardianbot:${POSTGRES_PASSWORD}@postgres:5432/guardianbot
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private, edge]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: guardianbot
      POSTGRES_USER: guardianbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U guardianbot]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes: [valkey-data:/data]
    networks: [private]
    security_opt: [no-new-privileges:true]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      GUARDIANBOT_HOSTNAME: ${GUARDIANBOT_HOSTNAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports: ["80:80", "443:443"]
    networks: [edge]
    depends_on: [control-plane]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: [./prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    networks: [private]

networks:
  private:
    internal: true
  edge:

volumes:
  postgres-data:
  valkey-data:
  caddy-data:
